name: Deploy StockScout Terminal

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/index.html'
      - 'frontend/package.json'
      - 'frontend/tsconfig*.json'
      - 'frontend/vite.config.ts'
      - 'hydrate_frontend_charts.py'
      - 'enhance_frontend_dataset.py'
      - '.github/workflows/frontend_pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ hashFiles('frontend/public/data/latest.json') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Hydrate 5Y chart shards and decision features
        if: ${{ hashFiles('frontend/public/data/latest.json') != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas
          python hydrate_frontend_charts.py
          python enhance_frontend_dataset.py
          test -s frontend/public/data/latest.json
          echo "Feature coverage: $(python - <<'PY'
          import json
          p=json.load(open('frontend/public/data/latest.json'))
          print(p.get('market',{}).get('featureCoverage',0))
          PY
          )"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
