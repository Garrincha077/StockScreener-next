name: Apply chart and grid hotfix

on:
  push:
    branches: [main]
    paths:
      - 'patch_chart_grid_hotfix.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply source hotfix
        run: python patch_chart_grid_hotfix.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm install
          npm run check

      - name: Commit validated hotfix and clean one-shot files
        shell: bash
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          rm -f patch_chart_grid_hotfix.py .github/workflows/apply_chart_grid_hotfix.yml
          git add frontend/src/DeepVueTerminal.tsx frontend/src/deepvue/runtime.ts
          git add -u patch_chart_grid_hotfix.py .github/workflows/apply_chart_grid_hotfix.yml
          git commit -m "fix: make charts and rapid review resilient"
          git push origin HEAD:main
