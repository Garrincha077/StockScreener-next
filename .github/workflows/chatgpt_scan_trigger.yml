name: ChatGPT StockScout Scan Trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/scan-trigger'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  run-production-scan:
    uses: ./.github/workflows/daily_screening_git_storage.yml
    secrets: inherit
