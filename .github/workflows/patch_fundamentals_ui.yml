name: One-shot fundamentals UI patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch_fundamentals_ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch fundamentals into DeepVue screener
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          terminal_path = Path('frontend/src/DeepVueTerminal.tsx')
          terminal = terminal_path.read_text(encoding='utf-8')

          terminal = replace_once(
              terminal,
              "  fundamentalGrowthScore?:number|null;fundamentalMarginScore?:number|null;fundamentalInventoryScore?:number|null\n",
              "  fundamentalGrowthScore?:number|null;fundamentalMarginScore?:number|null;fundamentalInventoryScore?:number|null\n"
              "  operatingCashFlowYoY?:number|null;freeCashFlowYoY?:number|null;freeCashFlowMargin?:number|null;totalDebtYoY?:number|null;netDebt?:number|null;shareDilutionYoY?:number|null;fundamentalDataSource?:string|null\n",
              'Stock fundamentals type projection',
          )

          terminal = replace_once(
              terminal,
              "fundamentalEvidenceConfidence:false,",
              "",
              'show fundamental confidence by default',
          )
          terminal = replace_once(
              terminal,
              "fundamentalEvidenceCoverage:false,",
              "fundamentalEvidenceCoverage:false,revenueYoY:false,epsYoY:false,operatingCashFlowYoY:false,freeCashFlowYoY:false,freeCashFlowMargin:false,totalDebtYoY:false,netDebt:false,shareDilutionYoY:false,",
              'hide detailed fundamental columns in core view',
          )
          terminal = replace_once(
              terminal,
              "loadLocal('dv-cols-v1',defaultVisibility)",
              "loadLocal('dv-cols-v2',defaultVisibility)",
              'column visibility migration read',
          )
          terminal = replace_once(
              terminal,
              "localStorage.setItem('dv-cols-v1',JSON.stringify(visibility))",
              "localStorage.setItem('dv-cols-v2',JSON.stringify(visibility))",
              'column visibility migration write',
          )

          column_anchor = "    helper.accessor('fundamentalEvidenceCoverage',{header:'Fund Cov',cell:i=>`${fmt(i.getValue(),0)}%`}),\n"
          fundamental_columns = column_anchor + (
              "    helper.accessor('revenueYoY',{header:'Rev YoY',cell:i=><span className={num(i.getValue())>0?'dv-good':num(i.getValue())<0?'dv-bad':''}>{signed(i.getValue())}</span>}),\n"
              "    helper.accessor('epsYoY',{header:'EPS YoY',cell:i=><span className={num(i.getValue())>0?'dv-good':num(i.getValue())<0?'dv-bad':''}>{signed(i.getValue())}</span>}),\n"
              "    helper.accessor('operatingCashFlowYoY',{header:'OCF YoY',cell:i=><span className={num(i.getValue())>0?'dv-good':num(i.getValue())<0?'dv-bad':''}>{signed(i.getValue())}</span>}),\n"
              "    helper.accessor('freeCashFlowYoY',{header:'FCF YoY',cell:i=><span className={num(i.getValue())>0?'dv-good':num(i.getValue())<0?'dv-bad':''}>{signed(i.getValue())}</span>}),\n"
              "    helper.accessor('freeCashFlowMargin',{header:'FCF Margin',cell:i=><span className={num(i.getValue())>0?'dv-good':num(i.getValue())<0?'dv-bad':''}>{signed(i.getValue())}</span>}),\n"
              "    helper.accessor('totalDebtYoY',{header:'Debt YoY',cell:i=><span className={num(i.getValue())<0?'dv-good':num(i.getValue())>0?'dv-bad':''}>{signed(i.getValue())}</span>}),\n"
              "    helper.accessor('netDebt',{header:'Net Debt',cell:i=><span className={num(i.getValue())<0?'dv-good':''}>{compact(i.getValue())}</span>}),\n"
              "    helper.accessor('shareDilutionYoY',{header:'Dilution YoY',cell:i=><span className={num(i.getValue())<=0?'dv-good':num(i.getValue())>2?'dv-bad':''}>{signed(i.getValue())}</span>}),\n"
          )
          terminal = replace_once(terminal, column_anchor, fundamental_columns, 'fundamental table columns')

          old_preset = "Fundamentals:{...defaultVisibility,fundamentalEvidenceScore:true,fundamentalEvidenceConfidence:true,fundamentalEvidenceCoverage:true,fundamentalSupport:true}"
          new_preset = "Fundamentals:{...defaultVisibility,fundamentalEvidenceScore:true,fundamentalEvidenceConfidence:true,fundamentalEvidenceCoverage:true,fundamentalSupport:true,revenueYoY:true,epsYoY:true,operatingCashFlowYoY:true,freeCashFlowYoY:true,freeCashFlowMargin:true,totalDebtYoY:true,netDebt:true,shareDilutionYoY:true}"
          terminal = replace_once(terminal, old_preset, new_preset, 'Fundamentals column preset')

          terminal_path.write_text(terminal, encoding='utf-8')

          filter_path = Path('frontend/src/deepvue/filterEngine.ts')
          filters = filter_path.read_text(encoding='utf-8')

          field_anchor = "  {id:'fundamentalEvidenceCoverage',label:'Fundamental coverage %',kind:'number',defaultOp:'>='},\n"
          field_block = field_anchor + (
              "  {id:'revenueYoY',label:'Revenue YoY %',kind:'number',defaultOp:'>='},\n"
              "  {id:'epsYoY',label:'EPS YoY %',kind:'number',defaultOp:'>='},\n"
              "  {id:'operatingCashFlowYoY',label:'Operating cash flow YoY %',kind:'number',defaultOp:'>='},\n"
              "  {id:'freeCashFlowYoY',label:'Free cash flow YoY %',kind:'number',defaultOp:'>='},\n"
              "  {id:'freeCashFlowMargin',label:'Free cash flow margin %',kind:'number',defaultOp:'>='},\n"
              "  {id:'totalDebtYoY',label:'Total debt YoY % (lower better)',kind:'number',defaultOp:'<='},\n"
              "  {id:'netDebt',label:'Net debt (lower better)',kind:'number',defaultOp:'<='},\n"
              "  {id:'shareDilutionYoY',label:'Share dilution YoY % (lower better)',kind:'number',defaultOp:'<='},\n"
          )
          filters = replace_once(filters, field_anchor, field_block, 'fundamental filter fields')

          old_confirmed = "    visibility:{emergingArchetype:true,emergingEvidenceCount:true,fundamentalEvidenceScore:true,fundamentalEvidenceConfidence:true},\n"
          new_confirmed = "    visibility:{emergingArchetype:true,emergingEvidenceCount:true,fundamentalEvidenceScore:true,fundamentalEvidenceConfidence:true,revenueYoY:true,epsYoY:true,freeCashFlowYoY:true,freeCashFlowMargin:true,totalDebtYoY:true,shareDilutionYoY:true},\n"
          filters = replace_once(filters, old_confirmed, new_confirmed, 'confirmed emerging visibility')

          group_anchor = "  {\n    name:'Group-confirmed Emerging',rootLogic:'ALL',recipe:'All',query:'',pageSize:100,\n"
          quality_screen = (
              "  {\n"
              "    name:'Fundamental Quality',rootLogic:'ALL',recipe:'All',query:'',pageSize:100,\n"
              "    visibility:{fundamentalEvidenceScore:true,fundamentalEvidenceConfidence:true,fundamentalEvidenceCoverage:true,revenueYoY:true,epsYoY:true,operatingCashFlowYoY:true,freeCashFlowYoY:true,freeCashFlowMargin:true,totalDebtYoY:true,netDebt:true,shareDilutionYoY:true},\n"
              "    sorting:[{id:'fundamentalEvidenceScore',desc:true},{id:'fundamentalEvidenceConfidence',desc:true},{id:'revenueYoY',desc:true},{id:'freeCashFlowYoY',desc:true}],\n"
              "    groups:[group('ALL',[rule('fundamentalEvidenceScore','>=','65'),rule('fundamentalEvidenceConfidence','>=','70')])],\n"
              "  },\n"
          ) + group_anchor
          filters = replace_once(filters, group_anchor, quality_screen, 'Fundamental Quality built-in screen')

          filter_path.write_text(filters, encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm install
          npm run check

      - name: Commit production UI patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch_fundamentals_ui.yml
          git add frontend/src/DeepVueTerminal.tsx frontend/src/deepvue/filterEngine.ts
          git commit -m "feat: expose sortable fundamental evidence"
          git pull --rebase origin main
          git push origin HEAD:main
