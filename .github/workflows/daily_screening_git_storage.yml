name: Daily Stock Screening (Post-Market)

# Deliberately no schedule. Production scheduling remains gated on ten
# consecutive green production-style Full Validation runs.
on:
  workflow_dispatch:
    inputs:
      force_full_refresh:
        description: Force refresh all fundamentals
        required: false
        type: boolean
        default: false
      allow_prior_session_backfill:
        description: Explicitly allow a prior completed session before 16:30 ET
        required: false
        type: boolean
        default: false
      publish_snapshot:
        description: Publish immutable validated-scan-snapshot (main only)
        required: false
        type: boolean
        default: true
      deploy_pages:
        description: Deploy the exact validated snapshot to Pages (main only)
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      force_full_refresh:
        required: false
        type: boolean
        default: false
      allow_prior_session_backfill:
        required: false
        type: boolean
        default: false
      publish_snapshot:
        required: false
        type: boolean
        default: false
      deploy_pages:
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: stockscout-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screen-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      actions: read
      contents: read
    outputs:
      canonical_sha: ${{ steps.snapshot-meta.outputs.canonical_sha }}
      frontend_commit: ${{ steps.snapshot-meta.outputs.frontend_commit }}
      snapshot_name: validated-scan-snapshot
    steps:
      - name: Checkout source without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install hash-locked CI dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock

      - name: Restore the latest successful main snapshot state when available
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/prior-snapshot"
          mkdir -p "$destination"
          artifact_id=""
          while IFS=$'\t' read -r candidate_id run_id branch; do
            [ "$branch" = "main" ] || continue
            conclusion=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion')
            if [ "$conclusion" = "success" ]; then artifact_id="$candidate_id"; break; fi
          done < <(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=validated-scan-snapshot&per_page=100" --jq '.artifacts[] | select(.expired == false) | [.id, .workflow_run.id, .workflow_run.head_branch] | @tsv')
          if [ -n "$artifact_id" ]; then
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/prior-snapshot.zip"
            unzip -q "$RUNNER_TEMP/prior-snapshot.zip" -d "$destination"
            echo "Restored immutable snapshot artifact $artifact_id"
          else
            echo "No successful validated-scan-snapshot exists yet; using repository bootstrap state"
          fi

      - name: Restore prior diff baseline and fundamentals cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/batch_results data/fundamentals_cache
          if [ -s "$RUNNER_TEMP/prior-snapshot/data/latest.json" ]; then
            cp "$RUNNER_TEMP/prior-snapshot/data/latest.json" data/batch_results/previous_frontend.json
          elif [ -s frontend/public/data/latest.json ]; then
            cp frontend/public/data/latest.json data/batch_results/previous_frontend.json
          fi
          if [ -d "$RUNNER_TEMP/prior-snapshot/cache/fundamentals_cache" ]; then
            cp -a "$RUNNER_TEMP/prior-snapshot/cache/fundamentals_cache/." data/fundamentals_cache/
          fi
          echo "CACHED_STOCKS=$(find data/fundamentals_cache -name '*_fundamentals.json' -type f | wc -l | tr -d ' ')" >> "$GITHUB_ENV"

      - name: Verify workflow contracts and frozen LEGACY source
        run: |
          python -m py_compile verify_legacy_baseline.py enrich_original_engine.py complete_legacy_capture.py hydrate_rich_fundamentals.py enrich_scan_layers.py fundamental_evidence.py apply_fundamental_evidence.py audit_fundamental_evidence.py compute_group_leadership.py audit_group_leadership.py audit_lateral_base.py audit_emerging_leader.py audit_frontend_dataset.py audit_pipeline_models.py compute_opportunity_v2.py finalize_opportunity_v2.py compute_daily_changes.py validate_scan_session.py validate_canonical_dataset.py validate_frontend_charts.py validate_snapshot_artifact.py smoke_pages_deploy.py export_frontend_data_fast.py hydrate_frontend_charts_readonly.py calibrate_frontend_setups.py prepare_frontend_payloads.py
          python verify_legacy_baseline.py
          python -m pytest tests/test_fast_batch_processor_regression.py tests/test_vcp_mapping.py tests/test_fundamental_evidence.py tests/test_group_leadership.py tests/test_emerging_leader.py tests/test_lateral_base.py tests/test_opportunity_v2.py tests/test_opportunity_v2_integration.py tests/test_prepare_frontend_payloads.py tests/test_validate_scan_session.py tests/test_validate_snapshot_artifact.py tests/test_workflow_hardening.py -q

      - name: Run optimized stock screening
        env:
          FORCE_FULL_REFRESH: ${{ inputs.force_full_refresh }}
        run: |
          mkdir -p data/daily_scans data/logs
          python run_fast_scan.py --conservative --git-storage
          test -s data/daily_scans/latest_optimized_scan.txt

      - name: Validate completed US market session
        env:
          ALLOW_PRIOR_SESSION_BACKFILL: ${{ inputs.allow_prior_session_backfill }}
        run: python validate_scan_session.py

      - name: Hydrate fundamentals and export the canonical snapshot
        env:
          FORCE_FULL_REFRESH: ${{ inputs.force_full_refresh }}
          RICH_FUNDAMENTALS_MAX_AGE_DAYS: '7'
          RICH_FUNDAMENTALS_REQUEST_DELAY: '0.35'
        shell: bash
        run: |
          python hydrate_rich_fundamentals.py
          python export_frontend_data_fast.py
          python enhance_frontend_dataset.py
          python calibrate_frontend_setups.py
          python compute_group_leadership.py
          python enrich_original_engine.py
          python complete_legacy_capture.py
          python enrich_scan_layers.py
          python apply_fundamental_evidence.py
          python compute_opportunity_v2.py
          python compute_daily_changes.py data/batch_results/previous_frontend.json frontend/public/data/latest.json
          python finalize_opportunity_v2.py
          test -s frontend/public/data/latest.json
          test -d frontend/public/data/charts

      - name: Run canonical, model and LEGACY audits
        run: |
          python validate_canonical_dataset.py
          python audit_pipeline_models.py
          python audit_fundamental_evidence.py
          python verify_legacy_baseline.py
          python audit_legacy_confirmation_shadow.py frontend/public/data/latest.json

      - name: Build manifest v2 client projection
        run: |
          before=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          python prepare_frontend_payloads.py
          after=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          test "$before" = "$after"

      - name: Enforce immutable snapshot and 98 percent chart gate
        run: python validate_snapshot_artifact.py --data-root frontend/public/data --min-chart-coverage 98

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build terminal with validated scan data
        working-directory: frontend
        run: |
          npm ci
          npm run check
          test ! -e dist/data/latest.json

      - name: Verify the exact Pages tree
        run: python validate_snapshot_artifact.py --data-root frontend/public/data --site-root frontend/dist --min-chart-coverage 98

      - name: Package immutable validated snapshot
        id: snapshot-meta
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/validated-snapshot"
          mkdir -p "$bundle/data" "$bundle/site" "$bundle/cache/fundamentals_cache" "$bundle/reports"
          cp -a frontend/public/data/. "$bundle/data/"
          cp -a frontend/dist/. "$bundle/site/"
          cp -a data/fundamentals_cache/. "$bundle/cache/fundamentals_cache/"
          cp -a data/daily_scans/. "$bundle/reports/"
          CANONICAL_SHA=$(sha256sum "$bundle/data/latest.json" | cut -d' ' -f1)
          MANIFEST_SHA=$(sha256sum "$bundle/data/manifest.json" | cut -d' ' -f1)
          GENERATED_AT=$(python -c "import json; print(json.load(open('$bundle/data/manifest.json'))['generatedAt'])")
          python -c "import json,pathlib; pathlib.Path('$bundle/snapshot-metadata.json').write_text(json.dumps({'schemaVersion':1,'canonicalSha256':'$CANONICAL_SHA','manifestSha256':'$MANIFEST_SHA','generatedAt':'$GENERATED_AT','scanSourceCommit':'$GITHUB_SHA','frontendSourceCommit':'$GITHUB_SHA','workflowRunId':'$GITHUB_RUN_ID'},indent=2)+'\n',encoding='utf-8')"
          python validate_snapshot_artifact.py --data-root "$bundle/data" --site-root "$bundle/site" --metadata "$bundle/snapshot-metadata.json" --min-chart-coverage 98 --expected-canonical-sha "$CANONICAL_SHA" --expected-frontend-commit "$GITHUB_SHA"
          echo "canonical_sha=$CANONICAL_SHA" >> "$GITHUB_OUTPUT"
          echo "frontend_commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload immutable validated scan snapshot
        if: ${{ inputs.publish_snapshot && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: validated-scan-snapshot
          path: ${{ runner.temp }}/validated-snapshot
          if-no-files-found: error
          retention-days: 90

      - name: Upload recovery state and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/daily_scans/
            data/logs/
            data/batch_results/batch_progress.pkl
            frontend/public/data/
          if-no-files-found: warn
          retention-days: 30

      - name: Publication policy summary
        if: always()
        shell: bash
        run: |
          echo "## StockScout publication policy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source ref: $GITHUB_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "- publish_snapshot input: ${{ inputs.publish_snapshot }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- deploy_pages input: ${{ inputs.deploy_pages }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Feature branches produce recovery artifacts only." >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    needs: screen-stocks
    if: ${{ needs.screen-stocks.result == 'success' && inputs.publish_snapshot && inputs.deploy_pages && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages_deploy.yml
    with:
      artifact_name: validated-scan-snapshot
      expected_canonical_sha: ${{ needs.screen-stocks.outputs.canonical_sha }}
      expected_frontend_commit: ${{ needs.screen-stocks.outputs.frontend_commit }}
