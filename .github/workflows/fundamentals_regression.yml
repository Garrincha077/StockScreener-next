name: Fundamentals Regression

on:
  pull_request:
    paths:
      - 'src/data/fundamentals_fetcher.py'
      - 'apply_fundamental_evidence.py'
      - 'fundamental_evidence.py'
      - 'tests/test_fundamentals_fetcher_extended.py'
      - 'tests/test_fundamental_evidence.py'
      - '.github/workflows/fundamentals_regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fundamentals-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile fundamental pipeline
        run: python -m py_compile src/data/fundamentals_fetcher.py fundamental_evidence.py apply_fundamental_evidence.py
      - name: Upstream compatibility and additive-metric tests
        run: python -m pytest tests/test_fundamentals_fetcher_extended.py tests/test_fundamental_evidence.py -q
