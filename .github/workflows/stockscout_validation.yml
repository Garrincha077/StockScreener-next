name: StockScout Validation

on:
  push:
    paths:
      - 'run_optimized_scan.py'
      - 'run_fast_scan.py'
      - 'src/screening/fast_batch_processor.py'
      - 'src/screening/optimized_batch_processor.py'
      - 'src/screening/signal_engine.py'
      - 'src/screening/phase_indicators.py'
      - 'src/screening/benchmark.py'
      - 'src/data/**'
      - 'config/legacy_baseline.json'
      - 'verify_legacy_baseline.py'
      - 'tests/test_fast_batch_processor_regression.py'
      - 'tests/test_vcp_mapping.py'
      - 'tests/test_legacy_fast_differential.py'
      - 'tests/test_setup_calibration.py'
      - 'tests/test_fundamental_evidence.py'
      - 'fundamental_evidence.py'
      - 'apply_fundamental_evidence.py'
      - 'audit_fundamental_evidence.py'
      - 'export_frontend_data_fast.py'
      - 'enhance_frontend_dataset.py'
      - 'calibrate_frontend_setups.py'
      - 'compute_group_leadership.py'
      - 'audit_frontend_dataset.py'
      - '.github/workflows/stockscout_validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify frozen LEGACY execution graph
        run: python verify_legacy_baseline.py

      - name: Regression and differential tests
        run: |
          python -m pytest \
            tests/test_fast_batch_processor_regression.py \
            tests/test_vcp_mapping.py \
            tests/test_legacy_fast_differential.py \
            tests/test_setup_calibration.py \
            tests/test_fundamental_evidence.py -q

      - name: Syntax-check enrichment engines
        run: python -m py_compile compute_group_leadership.py export_frontend_data_fast.py calibrate_frontend_setups.py fundamental_evidence.py apply_fundamental_evidence.py audit_fundamental_evidence.py

      - name: Apply current setup calibration in workspace
        run: python calibrate_frontend_setups.py

      - name: Dataset calibration audit
        run: python audit_frontend_dataset.py
