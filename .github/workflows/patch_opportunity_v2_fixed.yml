name: One-shot Opportunity v2 patch fixed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch_opportunity_v2_fixed.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Opportunity v2 and wire pipeline/UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          opportunity = r'''#!/usr/bin/env python3
          """Build StockScout Opportunity v2 from setup potential + current timing.

          The existing Emerging Leader model remains intact as a discovery model.
          Opportunity v2 answers a narrower question: how compelling is this stock
          now? It separates structural potential from timing, then allows only
          bounded group/fundamental confirmation modifiers. Mature, extended or
          deteriorating setups are capped rather than hidden inside an opaque blend.
          """
          from __future__ import annotations

          import json
          import math
          from pathlib import Path
          from statistics import median
          from typing import Any

          DATA = Path("frontend/public/data/latest.json")
          MODEL = "stockscout-opportunity-v2-potential-timing"


          def finite(value: Any, default: float = 0.0) -> float:
              try:
                  out = float(value)
                  return out if math.isfinite(out) else float(default)
              except Exception:
                  return float(default)


          def optional(value: Any) -> float | None:
              try:
                  out = float(value)
                  return out if math.isfinite(out) else None
              except Exception:
                  return None


          def clamp(value: float, low: float = 0.0, high: float = 100.0) -> float:
              return max(low, min(high, float(value)))


          def ramp(value: Any, low: float, high: float) -> float:
              value = finite(value)
              if high <= low:
                  return 0.0
              return clamp((value - low) / (high - low) * 100.0)


          def band(value: Any, lo: float, sweet_lo: float, sweet_hi: float, hi: float) -> float:
              value = finite(value, lo)
              if sweet_lo <= value <= sweet_hi:
                  return 100.0
              if value < sweet_lo:
                  return clamp((value - lo) / max(1e-9, sweet_lo - lo) * 100.0)
              return clamp((hi - value) / max(1e-9, hi - sweet_hi) * 100.0)


          def weighted_available(items: list[tuple[float | None, float]], default: float = 50.0) -> float:
              usable = [(value, weight) for value, weight in items if value is not None]
              if not usable:
                  return float(default)
              total = sum(weight for _, weight in usable)
              return sum(float(value) * weight for value, weight in usable) / total


          def room_to_run(row: dict) -> float:
              return (
                  0.45 * band(row.get("distance10w", row.get("distance50")), -12, -4, 7, 14)
                  + 0.35 * band(row.get("distance30w"), -18, -5, 14, 25)
                  + 0.20 * band(row.get("breakoutPct"), -20, -7, 4, 12)
              )


          def potential_score(row: dict) -> tuple[float, str]:
              fresh = finite(row.get("stageFreshnessScore"), 50)
              room = room_to_run(row)
              neglected = (
                  0.40 * finite(row.get("resetScore"), 50)
                  + 0.30 * finite(row.get("neglectHistoryScore"), 50)
                  + 0.15 * fresh
                  + 0.15 * room
              )
              reawakening = (
                  0.40 * finite(row.get("reawakeningStructureScore"), 50)
                  + 0.25 * finite(row.get("dryResetScore"), 50)
                  + 0.20 * finite(row.get("recoveryScore"), 50)
                  + 0.15 * fresh
              )
              archetype = str(row.get("emergingArchetype") or "")
              if archetype == "Reset Reawakening":
                  return clamp(reawakening), archetype
              if archetype == "Neglected Emerging":
                  return clamp(neglected), archetype
              if reawakening > neglected:
                  return clamp(reawakening), "Reset Reawakening"
              return clamp(neglected), "Neglected Emerging"


          def timing_score(row: dict) -> tuple[float, dict[str, float]]:
              rs = 0.55 * ramp(row.get("rsRank"), 55, 95) + 0.45 * ramp(row.get("rsAcceleration"), -0.10, 0.90)
              phase_score = {"ENTRY": 100.0, "READY": 82.0, "WATCH": 62.0}.get(str(row.get("maClusterPhase") or "").upper(), 42.0)
              ma = weighted_available([(optional(row.get("maClusterScore")), 0.65), (phase_score, 0.35)])
              volume = weighted_available([
                  (ramp(row.get("volumeRatio", 1.0), 0.75, 2.25), 0.70),
                  (ramp(row.get("maClusterVolumePace", 1.0), 0.75, 1.75), 0.30),
              ])
              trigger = weighted_available([
                  (band(row.get("breakoutPct"), -15, -5, 4, 10), 0.50),
                  (band(row.get("distance10w", row.get("distance50")), -10, -4, 8, 14), 0.30),
                  (band(row.get("maClusterPricePct"), -8, -2, 4, 9) if optional(row.get("maClusterPricePct")) is not None else None, 0.20),
              ])
              timing = 0.35 * rs + 0.25 * ma + 0.20 * volume + 0.20 * trigger
              return clamp(timing), {
                  "rs": round(clamp(rs), 1),
                  "ma": round(clamp(ma), 1),
                  "volume": round(clamp(volume), 1),
                  "trigger": round(clamp(trigger), 1),
              }


          def modifier(score: Any, confidence: Any, max_points: float = 5.0) -> float:
              s = optional(score)
              c = optional(confidence)
              if s is None or c is None:
                  return 0.0
              out = ((s - 50.0) / 50.0) * max_points * clamp(c, 0, 100) / 100.0
              return max(-max_points, min(max_points, out))


          def score_row(row: dict) -> dict:
              potential, path = potential_score(row)
              timing, timing_parts = timing_score(row)
              group_mod = modifier(row.get("groupRank"), row.get("groupConfidence"))
              fund_mod = modifier(row.get("fundamentalEvidenceScore"), row.get("fundamentalEvidenceConfidence"))
              penalty = 0.0
              caps: list[tuple[float, str]] = []
              reasons: list[str] = [f"{path} potential", f"Timing {timing:.0f}"]
              stage = int(finite(row.get("stage")))
              stage2_age = finite(row.get("stage2AgeWeeks"))
              rs_accel = finite(row.get("rsAcceleration"))
              d10 = finite(row.get("distance10w", row.get("distance50")))
              d30 = finite(row.get("distance30w"))
              extended = bool(row.get("extended")) or d10 > 12 or d30 > 22

              if stage == 2 and stage2_age > 30:
                  penalty += 10
                  reasons.append("Mature Stage 2 -10")
              elif stage == 2 and stage2_age > 24:
                  penalty += 5
                  reasons.append("Maturing Stage 2 -5")
              if stage not in (1, 2):
                  caps.append((45, "Stage 3/4 cap"))
              if rs_accel <= -0.25:
                  caps.append((50, "RS deterioration cap"))
              elif rs_accel <= 0:
                  caps.append((65, "RS not accelerating cap"))
              if extended:
                  caps.append((50, "Extended cap"))
              elif d10 > 10 or d30 > 19:
                  caps.append((60, "Late extension cap"))
              if d10 < -15:
                  caps.append((55, "Below structure cap"))

              raw = 0.55 * potential + 0.45 * timing + group_mod + fund_mod - penalty
              final = clamp(raw)
              for cap_value, cap_reason in caps:
                  if final > cap_value:
                      final = cap_value
                      reasons.append(cap_reason)

              return {
                  "opportunityPotential": round(potential, 1),
                  "opportunityTiming": round(timing, 1),
                  "opportunityTimingRS": timing_parts["rs"],
                  "opportunityTimingMA": timing_parts["ma"],
                  "opportunityTimingVolume": timing_parts["volume"],
                  "opportunityTimingTrigger": timing_parts["trigger"],
                  "opportunityGroupModifier": round(group_mod, 1),
                  "opportunityFundModifier": round(fund_mod, 1),
                  "opportunityPenalty": round(penalty, 1),
                  "opportunityRawScore": round(clamp(raw), 1),
                  "opportunityScore": round(final, 1),
                  "opportunityReasons": reasons[:6],
              }


          def assign_ranks(rows: list[dict]) -> None:
              ordered = sorted(rows, key=lambda row: finite(row.get("opportunityScore")))
              n = len(ordered)
              i = 0
              while i < n:
                  score = finite(ordered[i].get("opportunityScore"))
                  j = i + 1
                  while j < n and finite(ordered[j].get("opportunityScore")) == score:
                      j += 1
                  avg_pos = (i + j - 1) / 2.0
                  rank = 99 if n <= 1 else int(round(1 + 98 * avg_pos / (n - 1)))
                  for k in range(i, j):
                      ordered[k]["opportunityRank"] = rank
                  i = j


          def tier(score: float) -> str:
              if score >= 90:
                  return "PRIME"
              if score >= 80:
                  return "READY"
              if score >= 70:
                  return "WATCH"
              if score >= 55:
                  return "EARLY"
              return "PASS"


          def apply(payload: dict) -> dict:
              rows = payload.get("universe") or []
              for row in rows:
                  base_emerging = finite(row.get("emergingLeaderScore", row.get("opportunityScore", row.get("score"))))
                  row["emergingLeaderScore"] = round(base_emerging, 1)
                  row.update(score_row(row))
              assign_ranks(rows)
              counts = {name: 0 for name in ("PRIME", "READY", "WATCH", "EARLY", "PASS")}
              for row in rows:
                  row["opportunityTier"] = tier(finite(row.get("opportunityScore")))
                  counts[row["opportunityTier"]] += 1
                  stockscout = row.get("stockscout") if isinstance(row.get("stockscout"), dict) else {}
                  stockscout["opportunityV2"] = {
                      "model": MODEL,
                      "score": row["opportunityScore"],
                      "rank": row["opportunityRank"],
                      "tier": row["opportunityTier"],
                      "potential": row["opportunityPotential"],
                      "timing": row["opportunityTiming"],
                      "groupModifier": row["opportunityGroupModifier"],
                      "fundamentalModifier": row["opportunityFundModifier"],
                  }
                  row["stockscout"] = stockscout

              payload["opportunityModel"] = MODEL
              market = payload.setdefault("market", {})
              scores = [finite(row.get("opportunityScore")) for row in rows]
              potentials = [finite(row.get("opportunityPotential")) for row in rows]
              timings = [finite(row.get("opportunityTiming")) for row in rows]
              market["opportunityV2"] = {
                  "model": MODEL,
                  "rows": len(rows),
                  "weights": {"potential": 0.55, "timing": 0.45},
                  "maxGroupModifier": 5,
                  "maxFundamentalModifier": 5,
                  "tierCounts": counts,
                  "medianScore": round(median(scores), 1) if scores else 0,
                  "medianPotential": round(median(potentials), 1) if potentials else 0,
                  "medianTiming": round(median(timings), 1) if timings else 0,
              }
              if isinstance(market.get("fundamentalEvidence"), dict):
                  market["fundamentalEvidence"]["usedByOpportunityV2AsBoundedModifier"] = True
              market["groupUsedByOpportunityV2AsBoundedModifier"] = True
              return payload


          def main(path: Path = DATA) -> None:
              if not path.exists():
                  raise SystemExit(f"Missing canonical dataset: {path}")
              payload = json.loads(path.read_text(encoding="utf-8"))
              apply(payload)
              temp = path.with_suffix(".json.tmp")
              temp.write_text(json.dumps(payload, separators=(",", ":"), ensure_ascii=False), encoding="utf-8")
              temp.replace(path)
              stats = payload.get("market", {}).get("opportunityV2", {})
              print(
                  f"Opportunity v2 ready: median={stats.get('medianScore')}; "
                  f"potential={stats.get('medianPotential')}; timing={stats.get('medianTiming')}; "
                  f"tiers={stats.get('tierCounts')}"
              )


          if __name__ == "__main__":
              main()
          '''
          opportunity = "\n".join(line[10:] if line.startswith("          ") else line for line in opportunity.splitlines()) + "\n"
          Path('compute_opportunity_v2.py').write_text(opportunity, encoding='utf-8')

          tests = r'''from compute_opportunity_v2 import apply, modifier, score_row


          def base_row(**updates):
              row = {
                  "ticker": "TEST",
                  "stage": 2,
                  "stage2AgeWeeks": 6,
                  "emergingArchetype": "Neglected Emerging",
                  "emergingLeaderScore": 80,
                  "resetScore": 88,
                  "neglectHistoryScore": 85,
                  "stageFreshnessScore": 100,
                  "reawakeningStructureScore": 70,
                  "dryResetScore": 75,
                  "recoveryScore": 70,
                  "distance10w": 2,
                  "distance30w": 4,
                  "breakoutPct": 1,
                  "rsRank": 88,
                  "rsAcceleration": 0.65,
                  "maClusterScore": 85,
                  "maClusterPhase": "READY",
                  "maClusterVolumePace": 1.5,
                  "maClusterPricePct": 1,
                  "volumeRatio": 1.8,
                  "groupRank": 75,
                  "groupConfidence": 80,
                  "fundamentalEvidenceScore": 75,
                  "fundamentalEvidenceConfidence": 80,
                  "extended": False,
              }
              row.update(updates)
              return row


          def test_timing_changes_opportunity_without_destroying_potential():
              strong = score_row(base_row())
              sleeping = score_row(base_row(rsRank=58, rsAcceleration=-0.05, maClusterScore=45, maClusterPhase="WATCH", volumeRatio=0.8, maClusterVolumePace=0.8, breakoutPct=-10))
              assert abs(strong["opportunityPotential"] - sleeping["opportunityPotential"]) < 5
              assert strong["opportunityTiming"] > sleeping["opportunityTiming"] + 20
              assert strong["opportunityScore"] > sleeping["opportunityScore"] + 8


          def test_extended_setup_is_capped():
              out = score_row(base_row(extended=True, distance10w=16, distance30w=24))
              assert out["opportunityScore"] <= 50
              assert "Extended cap" in out["opportunityReasons"]


          def test_confirmation_modifiers_are_bounded_and_missing_is_neutral():
              assert modifier(100, 100) == 5
              assert modifier(0, 100) == -5
              assert modifier(None, 100) == 0
              assert modifier(90, None) == 0


          def test_apply_assigns_rank_tier_and_preserves_emerging_score():
              rows = [base_row(ticker="A"), base_row(ticker="B", rsRank=65, rsAcceleration=0.05, volumeRatio=1.0), base_row(ticker="C", stage=3, rsRank=40, rsAcceleration=-0.5)]
              payload = apply({"universe": rows, "market": {}})
              assert payload["opportunityModel"].startswith("stockscout-opportunity-v2")
              assert all(1 <= row["opportunityRank"] <= 99 for row in rows)
              assert rows[0]["opportunityRank"] > rows[-1]["opportunityRank"]
              assert rows[-1]["opportunityScore"] <= 45
              assert rows[0]["emergingLeaderScore"] == 80
              assert rows[0]["opportunityTier"] in {"PRIME", "READY", "WATCH", "EARLY", "PASS"}
          '''
          tests = "\n".join(line[10:] if line.startswith("          ") else line for line in tests.splitlines()) + "\n"
          Path('tests/test_opportunity_v2.py').write_text(tests, encoding='utf-8')

          workflow_path = Path('.github/workflows/daily_screening_git_storage.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = replace_once(workflow, 'fundamental_evidence.py apply_fundamental_evidence.py audit_fundamental_evidence.py compute_group_leadership.py audit_group_leadership.py validate_scan_session.py', 'fundamental_evidence.py apply_fundamental_evidence.py audit_fundamental_evidence.py compute_group_leadership.py audit_group_leadership.py compute_opportunity_v2.py compute_daily_changes.py validate_scan_session.py', 'py_compile Opportunity v2')
          workflow = replace_once(workflow, 'tests/test_fundamental_evidence.py tests/test_group_leadership.py tests/test_prepare_frontend_payloads.py -q', 'tests/test_fundamental_evidence.py tests/test_group_leadership.py tests/test_opportunity_v2.py tests/test_prepare_frontend_payloads.py -q', 'pytest Opportunity v2')
          workflow = replace_once(workflow, '          python complete_legacy_capture.py\n          python compute_daily_changes.py data/batch_results/previous_frontend.json frontend/public/data/latest.json\n          python enrich_scan_layers.py\n          python apply_fundamental_evidence.py\n', '          python complete_legacy_capture.py\n          python enrich_scan_layers.py\n          python apply_fundamental_evidence.py\n          python compute_opportunity_v2.py\n          python compute_daily_changes.py data/batch_results/previous_frontend.json frontend/public/data/latest.json\n', 'Opportunity ordering')
          workflow = replace_once(workflow, "          print('Fundamental Evidence:', m.get('fundamentalEvidence',{}))\n", "          print('Fundamental Evidence:', m.get('fundamentalEvidence',{}))\n          print('Opportunity model:', p.get('opportunityModel'))\n          print('Opportunity v2:', m.get('opportunityV2',{}))\n", 'Opportunity diagnostics')
          workflow = replace_once(workflow, '              "fundamental_evidence_model": "stockscout-fundamental-evidence-v1",\n', '              "fundamental_evidence_model": "stockscout-fundamental-evidence-v1",\n              "opportunity_model": "stockscout-opportunity-v2-potential-timing",\n', 'Opportunity metadata')
          workflow = replace_once(workflow, '            echo "**Fundamental Evidence:** transparent v1 score + separate coverage/confidence; does not affect Opportunity"\n            echo ""\n            echo "**Group Leadership:** confidence-weighted behavioral proxies; weak/noisy relationships are pulled toward neutral; Opportunity/Confluence unchanged"\n', '            echo "**Opportunity v2:** 55% structural Potential + 45% current Timing; bounded caps for extended/mature/deteriorating setups"\n            echo ""\n            echo "**Fundamental Evidence:** transparent v1 score + confidence; used only as a bounded +/-5 Opportunity v2 modifier"\n            echo ""\n            echo "**Group Leadership:** confidence-weighted behavioral proxies; used only as a bounded +/-5 Opportunity v2 modifier"\n', 'workflow summary wording')
          workflow_path.write_text(workflow, encoding='utf-8')

          diff_path = Path('compute_daily_changes.py')
          diff = diff_path.read_text(encoding='utf-8')
          diff = replace_once(diff, '    changed_count = 0\n', '    opportunity_comparable = bool(previous.get("opportunityModel") and previous.get("opportunityModel") == current.get("opportunityModel"))\n\n    changed_count = 0\n', 'daily diff model comparability')
          diff = replace_once(diff, '        opportunity_delta = rounded_delta(row.get("opportunityScore", row.get("score")), prev.get("opportunityScore", prev.get("score")), 1)\n', '        opportunity_delta = rounded_delta(row.get("opportunityScore", row.get("score")), prev.get("opportunityScore", prev.get("score")), 1) if opportunity_comparable else 0\n', 'daily diff Opportunity delta')
          diff = replace_once(diff, '        "previousGeneratedAt": previous.get("generatedAt"),\n', '        "previousGeneratedAt": previous.get("generatedAt"),\n        "opportunityComparable": opportunity_comparable,\n', 'daily diff metadata')
          diff_path.write_text(diff, encoding='utf-8')

          terminal_path = Path('frontend/src/DeepVueTerminal.tsx')
          terminal = terminal_path.read_text(encoding='utf-8')
          terminal = replace_once(terminal, '  opportunityScore?:number;confluence?:number;structureScore?:number;rsScore?:number;baseScore?:number;triggerScore?:number;freshnessScore?:number;neglectedScore?:number\n', '  opportunityScore?:number;opportunityPotential?:number;opportunityTiming?:number;opportunityRank?:number;opportunityTier?:string;opportunityGroupModifier?:number;opportunityFundModifier?:number;opportunityPenalty?:number;emergingLeaderScore?:number;confluence?:number;structureScore?:number;rsScore?:number;baseScore?:number;triggerScore?:number;freshnessScore?:number;neglectedScore?:number\n', 'frontend Opportunity types')
          terminal = replace_once(terminal, 'fundamentalSupport:false,fundamentalEvidenceCoverage:false,', 'fundamentalSupport:false,fundamentalEvidenceCoverage:false,opportunityGroupModifier:false,opportunityFundModifier:false,opportunityPenalty:false,emergingLeaderScore:false,', 'frontend hidden Opportunity details')
          terminal = replace_once(terminal, "loadLocal('dv-cols-v2',defaultVisibility)", "loadLocal('dv-cols-v3',defaultVisibility)", 'visibility migration read')
          terminal = replace_once(terminal, "localStorage.setItem('dv-cols-v2',JSON.stringify(visibility))", "localStorage.setItem('dv-cols-v3',JSON.stringify(visibility))", 'visibility migration write')

          opp_column = "    helper.accessor(s=>opp(s),{id:'opportunityScore',header:'Opportunity',cell:i=><b className=\"dv-score\">{fmt(i.getValue(),0)}</b>}),\n"
          opp_columns = opp_column + (
              "    helper.accessor('opportunityTier',{header:'Tier',cell:i=><b>{i.getValue()||'—'}</b>}),\n"
              "    helper.accessor('opportunityRank',{header:'Opp Rank',cell:i=><b className={num(i.getValue())>=95?'dv-good':''}>{fmt(i.getValue(),0)}</b>}),\n"
              "    helper.accessor('opportunityPotential',{header:'Potential',cell:i=>fmt(i.getValue(),0)}),\n"
              "    helper.accessor('opportunityTiming',{header:'Timing',cell:i=><b className={num(i.getValue())>=80?'dv-good':''}>{fmt(i.getValue(),0)}</b>}),\n"
              "    helper.accessor('opportunityGroupModifier',{header:'Group Δ',cell:i=><span className={num(i.getValue())>0?'dv-good':num(i.getValue())<0?'dv-bad':''}>{num(i.getValue())>0?'+':''}{fmt(i.getValue(),1)}</span>}),\n"
              "    helper.accessor('opportunityFundModifier',{header:'Fund Δ',cell:i=><span className={num(i.getValue())>0?'dv-good':num(i.getValue())<0?'dv-bad':''}>{num(i.getValue())>0?'+':''}{fmt(i.getValue(),1)}</span>}),\n"
              "    helper.accessor('opportunityPenalty',{header:'Penalty',cell:i=><span className={num(i.getValue())>0?'dv-bad':''}>{num(i.getValue())?`-${fmt(i.getValue(),0)}`:'—'}</span>}),\n"
              "    helper.accessor('emergingLeaderScore',{header:'Emerging',cell:i=>fmt(i.getValue(),0)}),\n"
          )
          terminal = replace_once(terminal, opp_column, opp_columns, 'Opportunity columns')
          terminal = replace_once(terminal, 'const sets:Record<string,VisibilityState>={Core:defaultVisibility,', 'const sets:Record<string,VisibilityState>={Core:defaultVisibility,Opportunity:{...defaultVisibility,opportunityTier:true,opportunityRank:true,opportunityPotential:true,opportunityTiming:true,opportunityGroupModifier:true,opportunityFundModifier:true,opportunityPenalty:true,emergingLeaderScore:true},', 'Opportunity column preset')
          terminal = replace_once(terminal, '<small>OPPORTUNITY</small>', "<small>OPPORTUNITY · {stock.opportunityTier||'—'}</small>", 'Opportunity header tier')
          terminal = replace_once(terminal, '<b>{opp(stock)}</b>{num(stock.opportunityDelta)!==0', '<b>{opp(stock)}</b><span>Rank {fmt(stock.opportunityRank,0)}</span>{num(stock.opportunityDelta)!==0', 'Opportunity header rank')
          terminal = replace_once(terminal, '<K l="Fund Ev" v={fmt(stock.fundamentalEvidenceScore,0)}/><K l="Fund conf" v={`${fmt(stock.fundamentalEvidenceConfidence,0)}%`}/></div>', "<K l=\"Potential\" v={fmt(stock.opportunityPotential,0)}/><K l=\"Timing\" v={fmt(stock.opportunityTiming,0)}/><K l=\"Opp Rank\" v={fmt(stock.opportunityRank,0)}/><K l=\"Group Δ\" v={`${num(stock.opportunityGroupModifier)>0?'+':''}${fmt(stock.opportunityGroupModifier,1)}`}/><K l=\"Fund Δ\" v={`${num(stock.opportunityFundModifier)>0?'+':''}${fmt(stock.opportunityFundModifier,1)}`}/><K l=\"Fund Ev\" v={fmt(stock.fundamentalEvidenceScore,0)}/><K l=\"Fund conf\" v={`${fmt(stock.fundamentalEvidenceConfidence,0)}%`}/></div>", 'Opportunity KPI breakdown')
          terminal = replace_once(terminal, '<small>evidence only · does not affect Opportunity</small>', '<small>confirmation evidence · bounded ±5 Opportunity modifier</small>', 'fundamental wording')
          terminal_path.write_text(terminal, encoding='utf-8')

          filter_path = Path('frontend/src/deepvue/filterEngine.ts')
          filters = filter_path.read_text(encoding='utf-8')
          filters = replace_once(filters, "  {id:'opportunityScore',label:'Emerging Score',kind:'number',defaultOp:'>='},\n", "  {id:'opportunityScore',label:'Opportunity v2 0-100',kind:'number',defaultOp:'>='},\n  {id:'opportunityRank',label:'Opportunity Rank 1-99',kind:'number',defaultOp:'>='},\n  {id:'opportunityTier',label:'Opportunity Tier',kind:'text',defaultOp:'='},\n  {id:'opportunityPotential',label:'Opportunity Potential 0-100',kind:'number',defaultOp:'>='},\n  {id:'opportunityTiming',label:'Opportunity Timing 0-100',kind:'number',defaultOp:'>='},\n  {id:'opportunityGroupModifier',label:'Opportunity Group modifier',kind:'number',defaultOp:'>='},\n  {id:'opportunityFundModifier',label:'Opportunity Fundamental modifier',kind:'number',defaultOp:'>='},\n  {id:'opportunityPenalty',label:'Opportunity penalty',kind:'number',defaultOp:'<='},\n  {id:'emergingLeaderScore',label:'Emerging discovery score 0-100',kind:'number',defaultOp:'>='},\n", 'Opportunity filter fields')
          filters = replace_once(filters, "  {id:'opportunityDelta',label:'Δ Emerging Score',kind:'number',defaultOp:'>='},\n", "  {id:'opportunityDelta',label:'Δ Opportunity Score',kind:'number',defaultOp:'>='},\n", 'Opportunity delta label')
          first_screen = "export const builtInScreens:ScreenState[]=[\n"
          prime = first_screen + "  {\n    name:'Prime / Ready Opportunities',rootLogic:'ALL',recipe:'All',query:'',pageSize:100,\n    visibility:{opportunityTier:true,opportunityRank:true,opportunityPotential:true,opportunityTiming:true,rsRank:true,volumeRatio:true,fundamentalEvidenceScore:true},\n    sorting:[{id:'opportunityScore',desc:true},{id:'opportunityRank',desc:true},{id:'opportunityTiming',desc:true},{id:'opportunityPotential',desc:true}],\n    groups:[group('ALL',[rule('opportunityScore','>=','80'),rule('opportunityRank','>=','90'),rule('extended','false')])],\n  },\n"
          filters = replace_once(filters, first_screen, prime, 'Prime Opportunity screen')
          filter_path.write_text(filters, encoding='utf-8')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python scoring layer
        run: |
          python -m py_compile compute_opportunity_v2.py compute_daily_changes.py
          python -m pytest tests/test_opportunity_v2.py -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm install
          npm run check

      - name: Commit production patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch_opportunity_v2_fixed.yml
          git add compute_opportunity_v2.py tests/test_opportunity_v2.py compute_daily_changes.py .github/workflows/daily_screening_git_storage.yml frontend/src/DeepVueTerminal.tsx frontend/src/deepvue/filterEngine.ts
          git commit -m "feat: add Opportunity v2 potential timing score"
          git pull --rebase origin main
          git push origin HEAD:main
