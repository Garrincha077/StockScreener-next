name: StockScout Validation

on:
  push:
    paths:
      - 'run_optimized_scan.py'
      - 'run_fast_scan.py'
      - 'src/screening/fast_batch_processor.py'
      - 'src/screening/optimized_batch_processor.py'
      - 'src/screening/signal_engine.py'
      - 'src/screening/phase_indicators.py'
      - 'src/screening/benchmark.py'
      - 'src/data/**'
      - 'config/legacy_baseline.json'
      - 'verify_legacy_baseline.py'
      - 'tests/test_fast_batch_processor_regression.py'
      - 'tests/test_vcp_mapping.py'
      - 'tests/test_legacy_fast_differential.py'
      - 'tests/test_setup_calibration.py'
      - 'tests/test_emerging_leader.py'
      - 'tests/test_ma_cluster_breakout.py'
      - 'tests/test_scout_tiers.py'
      - 'tests/test_fundamental_evidence.py'
      - 'tests/test_group_leadership.py'
      - 'tests/test_lateral_base.py'
      - 'tests/test_opportunity_v2.py'
      - 'tests/test_opportunity_v2_integration.py'
      - 'emerging_leader.py'
      - 'audit_emerging_leader.py'
      - 'compute_ma_cluster_breakout.py'
      - 'audit_ma_cluster_breakout.py'
      - 'audit_scout_tiers.py'
      - 'fundamental_evidence.py'
      - 'apply_fundamental_evidence.py'
      - 'audit_fundamental_evidence.py'
      - 'lateral_base.py'
      - 'compute_lateral_base.py'
      - 'audit_lateral_base.py'
      - 'export_frontend_data_fast.py'
      - 'enhance_frontend_dataset.py'
      - 'calibrate_frontend_setups.py'
      - 'compute_group_leadership.py'
      - 'audit_group_leadership.py'
      - 'compute_opportunity_v2.py'
      - 'finalize_opportunity_v2.py'
      - 'compute_daily_changes.py'
      - 'audit_pipeline_models.py'
      - 'audit_frontend_dataset.py'
      - 'frontend/src/DeepVueTerminal.tsx'
      - 'frontend/src/GroupsPage.tsx'
      - 'frontend/src/deepvue/filterEngine.ts'
      - '.github/workflows/stockscout_validation.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VALIDATED_SOURCE_RUN_ID: '32131202986'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore validated 5Y production snapshot
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: /tmp/stockscout-pages
          repository: Garrincha077/stock-screener2
          run-id: ${{ env.VALIDATED_SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install production data + chart shards in validation workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stockscout-site
          if [ -f /tmp/stockscout-pages/artifact.tar ]; then
            tar -xf /tmp/stockscout-pages/artifact.tar -C /tmp/stockscout-site
          else
            cp -a /tmp/stockscout-pages/. /tmp/stockscout-site/
          fi
          test -s /tmp/stockscout-site/data/latest.json
          test -d /tmp/stockscout-site/data/charts
          CHARTS=$(find /tmp/stockscout-site/data/charts -name '*.json' -type f | wc -l | tr -d ' ')
          test "$CHARTS" -gt 0
          rm -rf frontend/public/data
          cp -a /tmp/stockscout-site/data frontend/public/data
          echo "Validation restored $CHARTS real 5Y chart shards"
          python - <<'PY'
          import json
          p=json.load(open('frontend/public/data/latest.json'))
          print('Source generatedAt:',p.get('generatedAt'))
          print('Rows:',len(p.get('universe') or []))
          print('5Y charts:',(p.get('market') or {}).get('fiveYearCharts'))
          PY

      - name: Verify frozen LEGACY execution graph
        run: python verify_legacy_baseline.py

      - name: Regression and integration tests
        run: |
          python -m pytest \
            tests/test_fast_batch_processor_regression.py \
            tests/test_vcp_mapping.py \
            tests/test_legacy_fast_differential.py \
            tests/test_setup_calibration.py \
            tests/test_emerging_leader.py \
            tests/test_ma_cluster_breakout.py \
            tests/test_scout_tiers.py \
            tests/test_fundamental_evidence.py \
            tests/test_group_leadership.py \
            tests/test_lateral_base.py \
            tests/test_opportunity_v2.py \
            tests/test_opportunity_v2_integration.py -q

      - name: Syntax-check enrichment engines and audits
        run: |
          python -m py_compile \
            emerging_leader.py audit_emerging_leader.py \
            compute_ma_cluster_breakout.py audit_ma_cluster_breakout.py audit_scout_tiers.py \
            lateral_base.py compute_lateral_base.py audit_lateral_base.py \
            compute_group_leadership.py audit_group_leadership.py \
            compute_opportunity_v2.py finalize_opportunity_v2.py compute_daily_changes.py audit_pipeline_models.py \
            export_frontend_data_fast.py calibrate_frontend_setups.py \
            fundamental_evidence.py apply_fundamental_evidence.py audit_fundamental_evidence.py

      - name: Apply current model stack to validation snapshot
        run: |
          python calibrate_frontend_setups.py
          python compute_opportunity_v2.py
          python finalize_opportunity_v2.py

      - name: Integrated model compatibility audit
        run: |
          python audit_pipeline_models.py
          python audit_emerging_leader.py

      - name: MA Cluster timing audit
        env:
          MA_CLUSTER_REQUIRE_COVERAGE: '1'
        run: python audit_ma_cluster_breakout.py

      - name: Scout Tier audit
        run: python audit_scout_tiers.py

      - name: Print branch candidate summary
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          import json
          p=json.load(open('frontend/public/data/latest.json'))
          rows=p.get('universe') or []
          m=p.get('market') or {}
          print('=== REAL 5Y BRANCH CALIBRATION ===')
          print('Opportunity model:',p.get('opportunityModel'))
          print('Opportunity v2:',m.get('opportunityV2'))
          print('Emerging:',m.get('emergingLeaderCandidates'),'A+:',m.get('aPlusEmergingSetups'))
          print('MA coverage:',m.get('maClusterCoverage'))
          print('WATCH / READY / ENTRY:',m.get('maClusterWatchCount'),m.get('maClusterReadyCount'),m.get('maClusterEntryCount'))
          print('Timing tiers:',m.get('maClusterTierCounts'))
          print('Scout tiers:',m.get('scoutTierCounts'))
          priority=[r for r in rows if r.get('scoutTier') in {'A','B'}]
          priority.sort(key=lambda r:(r.get('scoutTierRank') or 0,r.get('maClusterPhase')=='ENTRY',r.get('emergingLeaderScore') or 0,r.get('rsRank') or 0),reverse=True)
          print('\nScout A/B:')
          for r in priority[:30]:
              print(f"{r.get('ticker'):5s} Scout={r.get('scoutTierLabel')} timing={r.get('maClusterTierLabel')} E={r.get('emergingLeaderScore',0):5.1f} Opp={r.get('opportunityScore',0):5.1f} RS={r.get('rsRank',0):2} accel={r.get('rsAcceleration',0):+.3f} spread={r.get('maClusterSpreadPct',0):4.1f}% vol={r.get('maClusterVolumePace',0):4.2f}x")
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend TypeScript and Vite build
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Upload PR-calibrated dataset
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: stockscout-pr-calibration-${{ github.run_id }}
          path: frontend/public/data/latest.json
          if-no-files-found: error
          retention-days: 14
