name: Build terminal from validated snapshot

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/e2e/**'
      - 'frontend/index.html'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/tsconfig*.json'
      - 'frontend/vite.config.ts'
      - 'validate_snapshot_artifact.py'
      - 'smoke_pages_deploy.py'
      - '.github/workflows/frontend_pages.yml'
      - '.github/workflows/pages_deploy.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: stockscout-frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      canonical_sha: ${{ steps.package.outputs.canonical_sha }}
      frontend_commit: ${{ steps.package.outputs.frontend_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download the latest successful validated main snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id=""
          while IFS=$'\t' read -r candidate_id run_id branch; do
            [ "$branch" = "main" ] || continue
            conclusion=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion')
            if [ "$conclusion" = "success" ]; then artifact_id="$candidate_id"; break; fi
          done < <(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=validated-scan-snapshot&per_page=100" --jq '.artifacts[] | select(.expired == false) | [.id, .workflow_run.id, .workflow_run.head_branch] | @tsv')
          if [ -z "$artifact_id" ]; then
            echo "::error::No successful, non-expired validated-scan-snapshot from main is available."
            exit 1
          fi
          destination="$RUNNER_TEMP/source-snapshot"
          mkdir -p "$destination"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/source-snapshot.zip"
          unzip -q "$RUNNER_TEMP/source-snapshot.zip" -d "$destination"
          echo "Using validated snapshot artifact $artifact_id"

      - name: Fail closed on missing, incomplete or mismatched snapshot
        run: |
          python validate_snapshot_artifact.py \
            --data-root "$RUNNER_TEMP/source-snapshot/data" \
            --site-root "$RUNNER_TEMP/source-snapshot/site" \
            --metadata "$RUNNER_TEMP/source-snapshot/snapshot-metadata.json" \
            --min-chart-coverage 98

      - name: Install validated data without market-data hydration
        shell: bash
        run: |
          rm -rf frontend/public/data
          mkdir -p frontend/public/data
          cp -a "$RUNNER_TEMP/source-snapshot/data/." frontend/public/data/

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
          test ! -e dist/data/latest.json

      - name: Verify rebuilt Pages tree against the downloaded snapshot
        run: python validate_snapshot_artifact.py --data-root frontend/public/data --site-root frontend/dist --min-chart-coverage 98

      - name: Package verified frontend snapshot
        id: package
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/validated-frontend-snapshot"
          mkdir -p "$bundle/data" "$bundle/site"
          cp -a frontend/public/data/. "$bundle/data/"
          cp -a frontend/dist/. "$bundle/site/"
          cp "$RUNNER_TEMP/source-snapshot/snapshot-metadata.json" "$bundle/snapshot-metadata.json"
          CANONICAL_SHA=$(sha256sum "$bundle/data/latest.json" | cut -d' ' -f1)
          MANIFEST_SHA=$(sha256sum "$bundle/data/manifest.json" | cut -d' ' -f1)
          python -c "import json,pathlib; p=pathlib.Path('$bundle/snapshot-metadata.json'); m=json.loads(p.read_text()); m.update({'manifestSha256':'$MANIFEST_SHA','frontendSourceCommit':'$GITHUB_SHA','frontendWorkflowRunId':'$GITHUB_RUN_ID'}); p.write_text(json.dumps(m,indent=2)+'\n',encoding='utf-8')"
          python validate_snapshot_artifact.py --data-root "$bundle/data" --site-root "$bundle/site" --metadata "$bundle/snapshot-metadata.json" --min-chart-coverage 98 --expected-canonical-sha "$CANONICAL_SHA" --expected-frontend-commit "$GITHUB_SHA"
          echo "canonical_sha=$CANONICAL_SHA" >> "$GITHUB_OUTPUT"
          echo "frontend_commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload immutable frontend deployment snapshot
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: validated-pages-snapshot
          path: ${{ runner.temp }}/validated-frontend-snapshot
          if-no-files-found: error
          retention-days: 30

      - name: Upload feature-branch recovery artifact
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/validated-frontend-snapshot
          if-no-files-found: warn
          retention-days: 14

  deploy-pages:
    needs: build
    if: ${{ needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages_deploy.yml
    with:
      artifact_name: validated-pages-snapshot
      expected_canonical_sha: ${{ needs.build.outputs.canonical_sha }}
      expected_frontend_commit: ${{ needs.build.outputs.frontend_commit }}
