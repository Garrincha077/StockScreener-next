name: StockScout Full Validation

# Final gate for StockScout Next scan/data/workflow changes.
# Full-run trigger: 2026-08-21 read-only Stable snapshot + Pages preview validation
on:
  push:
    paths:
      - '.github/workflows/stockscout_full_validation.yml'
      - '.github/workflows/validate_stable_snapshot_sync.yml'
      - '.github/workflows/deploy_latest_stable_preview.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  legacy-shadow-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: LEGACY shadow unit and client projection tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests/test_compute_legacy_confirmation.py tests/test_build_legacy_confirmation_sidecar.py tests/test_prepare_frontend_payloads.py -q

  full-scan:
    needs: legacy-shadow-unit
    uses: ./.github/workflows/daily_screening_git_storage.yml
    with:
      persist_outputs: false
      deploy_pages: false
