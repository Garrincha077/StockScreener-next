name: Deploy StockScout Terminal

# Code/data-only publisher for the latest verified Next canonical snapshot.
# Stable fallback is intentionally isolated in deploy_latest_stable_preview.yml.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/index.html'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/tsconfig*.json'
      - 'frontend/vite.config.ts'
      - 'compute_legacy_confirmation.py'
      - 'build_legacy_confirmation_sidecar.py'
      - 'prepare_frontend_payloads.py'
      - 'stamp_frontend_manifest.py'
      - 'validate_frontend_charts.py'
      - '.github/workflows/frontend_pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      generated_at: ${{ steps.source.outputs.generated_at }}
      workflow_run_id: ${{ steps.source.outputs.workflow_run_id }}
      scan_id: ${{ steps.identity.outputs.scan_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Validate checked-in authoritative Next snapshot
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend/public/data/latest.json
          test -s data/daily_scans/latest_scan_meta.json
          SOURCE_SHA=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          python - <<'PY' > /tmp/next-source-info.txt
          import json
          from pathlib import Path
          payload=json.loads(Path('frontend/public/data/latest.json').read_text(encoding='utf-8'))
          meta=json.loads(Path('data/daily_scans/latest_scan_meta.json').read_text(encoding='utf-8'))
          rows=payload.get('universe') or []
          generated=payload.get('generatedAt')
          if not rows or not generated:
              raise SystemExit('Next canonical snapshot is incomplete')
          if not meta.get('workflow_run_id') or not meta.get('generated_at_utc') or not meta.get('source_commit'):
              raise SystemExit('Next scan metadata is incomplete')
          if meta.get('generated_at_utc') != generated:
              raise SystemExit(f"Next scan metadata mismatch: meta={meta.get('generated_at_utc')} canonical={generated}")
          print(generated)
          print(meta['workflow_run_id'])
          print(len(rows))
          PY
          GENERATED_AT=$(sed -n '1p' /tmp/next-source-info.txt)
          WORKFLOW_RUN_ID=$(sed -n '2p' /tmp/next-source-info.txt)
          ROWS=$(sed -n '3p' /tmp/next-source-info.txt)
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "generated_at=$GENERATED_AT" >> "$GITHUB_OUTPUT"
          echo "workflow_run_id=$WORKFLOW_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Next generatedAt: $GENERATED_AT"
          echo "Next source workflow run: $WORKFLOW_RUN_ID"
          echo "Next universe: $ROWS"
          echo "Next canonical sha256: $SOURCE_SHA"

      - name: Build lightweight client payload + LEGACY shadow
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          python prepare_frontend_payloads.py
          python stamp_frontend_manifest.py \
            --manifest frontend/public/data/manifest.json \
            --canonical frontend/public/data/latest.json \
            --source-meta data/daily_scans/latest_scan_meta.json \
            --source-repository "${{ github.repository }}" \
            --source-ref main
          AFTER=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          test "$BEFORE" = "$AFTER"
          test "$AFTER" = "${{ steps.source.outputs.sha }}"
          test -s frontend/public/data/core.json
          test -s frontend/public/data/manifest.json
          test -s frontend/public/data/shadow/legacy-confirmation.json
          python - <<'PY' > /tmp/next-identity.txt
          import json
          core=json.load(open('frontend/public/data/core.json'))
          manifest=json.load(open('frontend/public/data/manifest.json'))
          shadow=json.load(open('frontend/public/data/shadow/legacy-confirmation.json'))
          source=(manifest.get('provenance') or {}).get('source') or {}
          publication=(manifest.get('provenance') or {}).get('publication') or {}
          assert core.get('generatedAt') == manifest.get('generatedAt') == (shadow.get('source') or {}).get('generatedAt')
          assert len(core.get('universe') or []) == manifest.get('universe') == shadow.get('total')
          assert shadow.get('affectsStockScout') is False
          assert source.get('repository') == '${{ github.repository }}'
          assert source.get('ref') == 'main'
          assert source.get('workflowRunId') == '${{ steps.source.outputs.workflow_run_id }}'
          assert source.get('sha256') == '${{ steps.source.outputs.sha }}'
          assert publication.get('repository') == '${{ github.repository }}'
          assert publication.get('workflowRunId') == '${{ github.run_id }}'
          assert manifest.get('scanId')
          print(manifest['scanId'])
          print('Next projection generatedAt:', manifest.get('generatedAt'))
          print('LEGACY shadow counts:', shadow.get('counts'))
          PY
          SCAN_ID=$(sed -n '1p' /tmp/next-identity.txt)
          echo "scan_id=$SCAN_ID" >> "$GITHUB_OUTPUT"
          cat /tmp/next-identity.txt

      - name: Enforce authoritative Next chart/data quality
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          python prepare_frontend_payloads.py
          python stamp_frontend_manifest.py \
            --manifest frontend/public/data/manifest.json \
            --canonical frontend/public/data/latest.json \
            --source-meta data/daily_scans/latest_scan_meta.json \
            --source-repository "${{ github.repository }}" \
            --source-ref main
          python stamp_frontend_manifest.py \
            --manifest frontend/public/data/manifest.json \
            --canonical frontend/public/data/latest.json \
            --source-meta data/daily_scans/latest_scan_meta.json \
            --source-repository "${{ github.repository }}" \
            --source-ref main \
            --verify-only
          FINAL=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          test "$BEFORE" = "$FINAL"
          test "$FINAL" = "${{ steps.source.outputs.sha }}"
          python validate_frontend_charts.py frontend/public --strict --minimum-coverage 0.95
          python - <<'PY'
          import json
          manifest=json.load(open('frontend/public/data/manifest.json'))
          charts=(manifest.get('assets') or {}).get('charts') or {}
          if float(charts.get('coveragePct') or 0) < 95:
              raise SystemExit(f"Manifest chart coverage below publication gate: {charts.get('coveragePct')}%")
          if manifest.get('scanId') != '${{ steps.identity.outputs.scan_id }}':
              raise SystemExit('scanId changed while refreshing chart descriptor')
          print('Authoritative scanId:', manifest.get('scanId'))
          print('Chart coverage:', charts.get('coveragePct'))
          PY
          echo "Next canonical latest.json unchanged in workspace: $FINAL"
          echo "Chart shards: $(find frontend/public/data/charts -name '*.json' 2>/dev/null | wc -l)"
          du -sh frontend/public/data

      - name: Refuse a Next canonical snapshot that advanced during build
        shell: bash
        env:
          BUILT_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          BUILT_GENERATED_AT: ${{ steps.source.outputs.generated_at }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/${{ github.repository }}/main/frontend/public/data/latest.json \
            --output /tmp/next-latest-recheck.json
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/${{ github.repository }}/main/data/daily_scans/latest_scan_meta.json \
            --output /tmp/next-meta-recheck.json
          CURRENT_SOURCE_SHA=$(sha256sum /tmp/next-latest-recheck.json | cut -d' ' -f1)
          test "$CURRENT_SOURCE_SHA" = "$BUILT_SOURCE_SHA"
          python - <<'PY'
          import json, os
          latest=json.load(open('/tmp/next-latest-recheck.json'))
          meta=json.load(open('/tmp/next-meta-recheck.json'))
          expected=os.environ['BUILT_GENERATED_AT']
          assert latest.get('generatedAt') == expected
          assert meta.get('generated_at_utc') == expected
          print('Next snapshot still current:', expected)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test, typecheck and build
        working-directory: frontend
        run: npm run check

      - name: Enforce Pages artifact chart coverage and identity
        shell: bash
        run: |
          test ! -e frontend/dist/data/latest.json
          python validate_frontend_charts.py frontend/dist --strict --minimum-coverage 0.95
          python - <<'PY'
          import json
          manifest=json.load(open('frontend/dist/data/manifest.json'))
          source=(manifest.get('provenance') or {}).get('source') or {}
          publication=(manifest.get('provenance') or {}).get('publication') or {}
          assert manifest.get('scanId') == '${{ steps.identity.outputs.scan_id }}'
          assert source.get('repository') == '${{ github.repository }}'
          assert source.get('ref') == 'main'
          assert source.get('sha256') == '${{ steps.source.outputs.sha }}'
          assert source.get('workflowRunId') == '${{ steps.source.outputs.workflow_run_id }}'
          assert publication.get('workflowRunId') == '${{ github.run_id }}'
          print('Pages artifact identity verified:', manifest.get('scanId'))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: stockscout-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify authoritative Next snapshot still matches built artifact
        shell: bash
        env:
          BUILT_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          BUILT_GENERATED_AT: ${{ needs.build.outputs.generated_at }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/${{ github.repository }}/main/frontend/public/data/latest.json \
            --output /tmp/next-latest-deploy-check.json
          CURRENT_SOURCE_SHA=$(sha256sum /tmp/next-latest-deploy-check.json | cut -d' ' -f1)
          test "$CURRENT_SOURCE_SHA" = "$BUILT_SOURCE_SHA"
          python - <<'PY'
          import json, os
          latest=json.load(open('/tmp/next-latest-deploy-check.json'))
          assert latest.get('generatedAt') == os.environ['BUILT_GENERATED_AT']
          PY
          echo "Deploying scan ${{ needs.build.outputs.scan_id }} from Next workflow ${{ needs.build.outputs.workflow_run_id }} snapshot ${{ needs.build.outputs.generated_at }}"

      - name: Deploy authoritative Next terminal build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
