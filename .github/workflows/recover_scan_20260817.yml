name: Recover Aug 17 Scan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover_scan_20260817.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download completed scan artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9297924504/zip" \
            --output /tmp/scan.zip
          rm -rf /tmp/recovered-scan
          mkdir -p /tmp/recovered-scan
          unzip -q /tmp/scan.zip -d /tmp/recovered-scan
          test -s /tmp/recovered-scan/data/daily_scans/latest_optimized_scan.txt
          test -s /tmp/recovered-scan/frontend/public/data/latest.json
          echo "Recovered artifact contents:"
          find /tmp/recovered-scan -maxdepth 4 -type f -printf '%p %k KB\n' | sort

      - name: Restore canonical scan outputs
        run: |
          mkdir -p data/daily_scans frontend/public/data
          cp /tmp/recovered-scan/data/daily_scans/latest_optimized_scan.txt data/daily_scans/latest_optimized_scan.txt
          cp /tmp/recovered-scan/data/daily_scans/latest_scan_meta.json data/daily_scans/latest_scan_meta.json
          cp /tmp/recovered-scan/frontend/public/data/latest.json frontend/public/data/latest.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade recovered data with 5Y charts and RS ranks
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas
          python hydrate_frontend_charts.py
          test -s frontend/public/data/latest.json
          test -d frontend/public/data/charts
          echo "5Y shard count: $(find frontend/public/data/charts -name '*.json' | wc -l)"
          du -sh frontend/public/data

      - name: Persist recovered canonical outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/daily_scans/latest_optimized_scan.txt
          git add -f data/daily_scans/latest_scan_meta.json
          git add -f frontend/public/data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: recover completed scan 2026-08-17"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                pushed=true
                break
              fi
              git rebase --abort || true
              sleep $((attempt * 3))
            done
            if [ "$pushed" != true ]; then
              echo "::warning::Live deploy will continue, but canonical data could not be pushed after retries."
            fi
          else
            echo "Canonical scan outputs already current"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install terminal dependencies
        working-directory: frontend
        run: npm install

      - name: Build latest terminal with recovered scan
        working-directory: frontend
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Upload upgraded recovery snapshot
        uses: actions/upload-artifact@v4
        with:
          name: recovered-scan-2026-08-17
          path: |
            data/daily_scans/latest_optimized_scan.txt
            data/daily_scans/latest_scan_meta.json
            frontend/public/data/latest.json
          retention-days: 30

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: recover
    steps:
      - name: Deploy recovered live terminal
        id: deployment
        uses: actions/deploy-pages@v4
