name: StockScout Full Validation

# Expensive end-to-end gate reserved for changes that can alter the canonical
# stock scan, persistence or completed-session publication identity.
#
# Pages-only publishing, GMLI/Factors sidecars, UI changes, chart transport and
# read-only presentation contracts use targeted validation instead and MUST NOT
# trigger a full stock-universe rescan.
#
# Run manually with workflow_dispatch whenever a broader release-level check is
# desired.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily_screening_git_storage.yml'
      - '.github/workflows/recover_failed_scan.yml'
      - '.github/workflows/validate_stable_snapshot_sync.yml'
      - 'scripts/sync_persistent_outputs.sh'
      - 'tests/test_sync_persistent_outputs.sh'
      - 'validate_scan_session.py'
      - 'tests/test_validate_scan_session.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/daily_screening_git_storage.yml'
      - '.github/workflows/recover_failed_scan.yml'
      - '.github/workflows/validate_stable_snapshot_sync.yml'
      - 'scripts/sync_persistent_outputs.sh'
      - 'tests/test_sync_persistent_outputs.sh'
      - 'validate_scan_session.py'
      - 'tests/test_validate_scan_session.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  legacy-shadow-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: LEGACY shadow and canonical scan-path contract tests
        run: |
          python -m pip install --upgrade pip pytest pandas
          python -m pytest \
            tests/test_compute_legacy_confirmation.py \
            tests/test_build_legacy_confirmation_sidecar.py \
            tests/test_prepare_frontend_payloads.py \
            tests/test_stamp_frontend_manifest.py \
            tests/test_validate_frontend_charts.py \
            tests/test_validate_scan_session.py -q
          bash tests/test_sync_persistent_outputs.sh

  full-scan:
    needs: legacy-shadow-unit
    uses: ./.github/workflows/daily_screening_git_storage.yml
    with:
      persist_outputs: false
      deploy_pages: false
