name: Build next-dev public preview

on:
  push:
    branches:
      - 'preview/next-dev-live'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: next-dev-static-preview
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Overlay latest authoritative main data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf frontend/public/data
          git archive origin/main frontend/public/data | tar -x
          test -s frontend/public/data/manifest.json
          test -s frontend/public/data/core.json
          test -d frontend/public/data/legacy/details

      - name: Resolve current production Pages artifact
        id: production
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(python - <<'PY'
          import json
          m=json.load(open('frontend/public/data/manifest.json'))
          run=str(((m.get('provenance') or {}).get('publication') or {}).get('workflowRunId') or '').strip()
          if not run.isdigit():
              raise SystemExit('Main manifest has no production publication workflowRunId')
          print(run)
          PY
          )
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using current production Pages artifact run $RUN_ID"

      - name: Download exact current production Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: /tmp/current-pages-artifact
          repository: ${{ github.repository }}
          run-id: ${{ steps.production.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Restore exact current production chart shards
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/current-pages-root
          mkdir -p /tmp/current-pages-root
          if [ -f /tmp/current-pages-artifact/artifact.tar ]; then
            tar -xf /tmp/current-pages-artifact/artifact.tar -C /tmp/current-pages-root
          else
            cp -a /tmp/current-pages-artifact/. /tmp/current-pages-root/
          fi
          test -s /tmp/current-pages-root/data/manifest.json
          test -d /tmp/current-pages-root/data/charts

          LIVE_ID=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/current-pages-root/data/manifest.json')).get('scanId') or '')
          PY
          )
          MAIN_ID=$(python - <<'PY'
          import json
          print(json.load(open('frontend/public/data/manifest.json')).get('scanId') or '')
          PY
          )
          test -n "$LIVE_ID"
          test "$LIVE_ID" = "$MAIN_ID"
          rm -rf frontend/public/data/charts
          cp -a /tmp/current-pages-root/data/charts frontend/public/data/charts
          echo "Restored exact chart shards for scan $MAIN_ID"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test and build next-dev code with latest main data
        working-directory: frontend
        run: npm run check

      - name: Prepare full static preview
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stockscout-next-dev-preview
          mkdir -p /tmp/stockscout-next-dev-preview
          cp -a frontend/dist/. /tmp/stockscout-next-dev-preview/
          touch /tmp/stockscout-next-dev-preview/.nojekyll
          test -s /tmp/stockscout-next-dev-preview/index.html
          test -s /tmp/stockscout-next-dev-preview/data/manifest.json
          test -s /tmp/stockscout-next-dev-preview/data/core.json
          test -s /tmp/stockscout-next-dev-preview/data/legacy/index.json
          test -d /tmp/stockscout-next-dev-preview/data/charts
          GENERATED_AT=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/stockscout-next-dev-preview/data/manifest.json'))['generatedAt'])
          PY
          )
          echo "generated_at=$GENERATED_AT" >> "$GITHUB_OUTPUT"
          echo "Preview generatedAt: $GENERATED_AT"

      - name: Publish generated preview branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan next-dev-preview-site
          git rm -rf .
          cp -a /tmp/stockscout-next-dev-preview/. .
          printf '%s\n' \
            "source_branch=preview/next-dev-live" \
            "source_sha=$GITHUB_SHA" \
            "data_ref=origin/main" \
            "generated_at=${{ steps.preview.outputs.generated_at }}" \
            "preview_url=https://raw.githack.com/Garrincha077/StockScreener-next/next-dev-preview-site/index.html" > PREVIEW_SOURCE.txt
          git add -A
          git commit -m "preview: next-dev ${GITHUB_SHA::8}"
          git push origin HEAD:refs/heads/next-dev-preview-site --force

      - name: Record durable preview handoff on next-dev
        shell: bash
        env:
          PREVIEW_GENERATED_AT: ${{ steps.preview.outputs.generated_at }}
        run: |
          set -euo pipefail
          git fetch origin next-dev
          rm -rf /tmp/next-dev-log
          git worktree add --detach /tmp/next-dev-log origin/next-dev
          cd /tmp/next-dev-log
          python - <<'PY'
          import os
          from pathlib import Path

          path=Path('docs/PROJECT_LOG.md')
          text=path.read_text(encoding='utf-8')
          marker='## 2026-08-26 — isolated `next-dev` visual preview published'
          if marker in text:
              raise SystemExit(0)
          section=f'''{marker}\n\n- Preview workflow/source branch: `preview/next-dev-live` @ `{os.environ['GITHUB_SHA']}`; generated static branch: `next-dev-preview-site`.\n- Purpose: provide a visual review surface for `next-dev` without merging it into `main` or changing `stock-screener2`. The preview build overlays the latest authoritative checked-in `main` Core/LEGACY payload and restores chart shards only from the exact current production Pages artifact for the same `scanId`.\n- Public preview: `https://raw.githack.com/Garrincha077/StockScreener-next/next-dev-preview-site/index.html`. This is a disposable development preview, not the production GitHub Pages endpoint.\n- Validation: preview workflow run `{os.environ['GITHUB_RUN_ID']}` passed `npm run check`, full static build, latest-data identity checks and exact chart-shard restore. Preview dataset `generatedAt={os.environ['PREVIEW_GENERATED_AT']}`. An attempted additive GitHub Pages subpath deployment was rejected by the protected Pages environment before deployment; no live Pages content was changed.\n- Behavior/model impact: preview/publication plumbing only. No StockScout Core or Ryan LEGACY scoring/runtime, scan generation, production scheduling, `main`, or stable fallback behavior changed. Full Validation was not required because the production scan/data/workflow path was not modified.\n\n**Next logical step**\n- Visually inspect the LEGACY detail panel in the isolated preview, especially a breakout ticker showing Assumed entry vs Pivot and a ticker with SELL evidence. Keep promotion to `main` separate and deliberate.\n\n'''
          anchor='Keep this file concise and factual. Update it after every meaningful code/workflow change.\n\n'
          if anchor not in text:
              raise SystemExit('PROJECT_LOG anchor not found')
          path.write_text(text.replace(anchor, anchor+section, 1), encoding='utf-8')
          PY
          if git diff --quiet -- docs/PROJECT_LOG.md; then
            echo "PROJECT_LOG already contains preview handoff"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_LOG.md
          git commit -m 'docs: log isolated next-dev preview'
          git fetch origin next-dev
          git rebase origin/next-dev
          git push origin HEAD:next-dev

      - name: Preview URL
        run: echo "https://raw.githack.com/Garrincha077/StockScreener-next/next-dev-preview-site/index.html"
