name: Frontend Compile Smoke

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/e2e/**'
      - 'frontend/index.html'
      - 'frontend/package.json'
      - 'frontend/tsconfig*.json'
      - 'frontend/vite.config.ts'
      - 'frontend/playwright.config.ts'
      - 'prepare_frontend_payloads.py'
      - 'hydrate_frontend_charts_readonly.py'
      - 'compute_ma_crosses.py'
      - 'tests/test_prepare_frontend_payloads.py'
      - 'tests/test_readonly_chart_snapshot.py'
      - 'tests/test_ma_crosses.py'
      - '.github/workflows/frontend_compile_smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/e2e/**'
      - 'frontend/index.html'
      - 'frontend/package.json'
      - 'frontend/tsconfig*.json'
      - 'frontend/vite.config.ts'
      - 'frontend/playwright.config.ts'
      - 'prepare_frontend_payloads.py'
      - 'hydrate_frontend_charts_readonly.py'
      - 'compute_ma_crosses.py'
      - 'tests/test_prepare_frontend_payloads.py'
      - 'tests/test_readonly_chart_snapshot.py'
      - 'tests/test_ma_crosses.py'
      - '.github/workflows/frontend_compile_smoke.yml'
  workflow_dispatch:

concurrency:
  group: frontend-compile-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Client payload, snapshot and MA cross tests
        run: |
          python -m pip install --upgrade pip pytest pandas yfinance
          python -m pytest tests/test_prepare_frontend_payloads.py tests/test_readonly_chart_snapshot.py tests/test_ma_crosses.py -q

      - name: Project the current canonical snapshot
        run: |
          BEFORE=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          python prepare_frontend_payloads.py
          AFTER=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          test "$BEFORE" = "$AFTER"
          test -s frontend/public/data/core.json
          cat frontend/public/data/manifest.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: frontend
        run: npm install

      - name: Runtime tests, TypeScript and Vite build
        working-directory: frontend
        run: npm run check

      - name: Prepare browser for Playwright
        working-directory: frontend
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo "PW_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            echo "System Chrome not found; installing Playwright Chromium fallback"
            npx playwright install --with-deps chromium
          fi

      - name: Mobile Rapid Review browser smoke
        working-directory: frontend
        run: npm run test:e2e
