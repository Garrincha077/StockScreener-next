name: Apply Opportunity v2 migration

on:
  push:
    branches: [main]
    paths:
      - '.github/opportunity_v2_migration_trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch and persist diagnostics
        shell: bash
        run: |
          set +e
          python scripts/patch_opportunity_v2_integration.py > /tmp/opportunity-v2.log 2>&1
          RC=$?
          cat /tmp/opportunity-v2.log
          {
            echo "exit_code=$RC"
            echo "commit=${GITHUB_SHA}"
            echo "---"
            cat /tmp/opportunity-v2.log
          } > .github/opportunity_v2_patch_status.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/opportunity_v2_patch_status.txt
          if [ "$RC" -eq 0 ]; then
            python -m py_compile compute_opportunity_v2.py compute_daily_changes.py
            python -m pytest tests/test_opportunity_v2.py -q
            TEST_RC=$?
            echo "test_exit_code=$TEST_RC" >> .github/opportunity_v2_patch_status.txt
            git add compute_daily_changes.py .github/workflows/daily_screening_git_storage.yml
            git add frontend/src/DeepVueTerminal.tsx frontend/src/deepvue/filterEngine.ts
            git add .github/opportunity_v2_patch_status.txt
            if [ "$TEST_RC" -ne 0 ]; then RC=$TEST_RC; fi
          fi

          git commit -m "ci: report Opportunity v2 migration status"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$RC"
