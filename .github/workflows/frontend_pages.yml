name: Validate StockScout Terminal

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/index.html'
      - 'frontend/package.json'
      - 'frontend/tsconfig*.json'
      - 'frontend/vite.config.ts'
      - '.github/workflows/frontend_pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-validation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: frontend
        run: npm install

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - name: Explain deployment ownership
        run: |
          echo "Frontend source validated successfully."
          echo "Live GitHub Pages deployment is owned by the stock-scan workflow so UI, latest.json and 5Y chart shards are deployed atomically."
