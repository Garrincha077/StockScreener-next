name: Deploy StockScout Terminal

on:
  push:
    branches: [main, phase3-review-pages]
    paths:
      - 'frontend/src/**'
      - 'frontend/index.html'
      - 'frontend/package.json'
      - 'frontend/tsconfig*.json'
      - 'frontend/vite.config.ts'
      - 'compute_legacy_confirmation.py'
      - 'build_legacy_confirmation_sidecar.py'
      - 'prepare_frontend_payloads.py'
      - 'hydrate_frontend_charts_readonly.py'
      - 'validate_frontend_charts.py'
      - '.github/workflows/frontend_pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      canonical_sha: ${{ steps.canonical.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Build lightweight client payload + LEGACY shadow
        run: |
          test -s frontend/public/data/latest.json
          BEFORE=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          python prepare_frontend_payloads.py
          AFTER=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          test "$BEFORE" = "$AFTER"
          test -s frontend/public/data/core.json
          test -s frontend/public/data/manifest.json
          test -s frontend/public/data/shadow/legacy-confirmation.json
          python - <<'PY'
          import json
          core=json.load(open('frontend/public/data/core.json'))
          manifest=json.load(open('frontend/public/data/manifest.json'))
          shadow=json.load(open('frontend/public/data/shadow/legacy-confirmation.json'))
          assert core.get('generatedAt') == manifest.get('generatedAt') == (shadow.get('source') or {}).get('generatedAt')
          assert len(core.get('universe') or []) == manifest.get('universe') == shadow.get('total')
          assert shadow.get('affectsStockScout') is False
          print('LEGACY shadow counts:', shadow.get('counts'))
          PY

      - name: Build read-only adjusted 5Y chart shards (best effort)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas
          BEFORE=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          HYDRATED=false
          for attempt in 1 2 3; do
            echo "Chart hydration attempt $attempt/3"
            rm -rf frontend/public/data/charts
            if python hydrate_frontend_charts_readonly.py; then
              HYDRATED=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          if [ "$HYDRATED" != true ]; then
            echo "::warning::Unable to rebuild full chart shards after 3 attempts; Pages deploy will continue with available/no charts."
          fi
          mkdir -p frontend/public/data/charts
          AFTER=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          test "$BEFORE" = "$AFTER"
          python validate_frontend_charts.py frontend/public
          echo "Canonical latest.json unchanged: $AFTER"
          echo "Chart shards: $(find frontend/public/data/charts -name '*.json' | wc -l)"
          du -sh frontend/public/data

      - name: Refuse a stale data build
        id: canonical
        shell: bash
        run: |
          LOCAL_SHA=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          git fetch origin main
          REMOTE_SHA=$(git show origin/main:frontend/public/data/latest.json | sha256sum | cut -d' ' -f1)
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "::error::Main scan data advanced while this frontend build was running; refusing to package a stale Pages deployment."
            exit 1
          fi
          echo "sha=$LOCAL_SHA" >> "$GITHUB_OUTPUT"
          echo "Canonical snapshot verified against origin/main: $LOCAL_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: frontend
        run: npm install

      - name: Test, typecheck and build
        working-directory: frontend
        run: npm run check

      - name: Report Pages artifact chart coverage
        shell: bash
        run: |
          python validate_frontend_charts.py frontend/dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: stockscout-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify artifact still matches current canonical scan
        shell: bash
        env:
          BUILT_SHA: ${{ needs.build.outputs.canonical_sha }}
        run: |
          CURRENT_SHA=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          if [ "$CURRENT_SHA" != "$BUILT_SHA" ]; then
            echo "::error::Canonical scan changed after this frontend artifact was built; refusing stale Pages deployment."
            exit 1
          fi
          echo "Deploy snapshot still current: $CURRENT_SHA"

      - name: Deploy read-only terminal build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
