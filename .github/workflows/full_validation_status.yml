name: Full Validation Status Recorder

on:
  workflow_run:
    workflows: ["StockScout Full Validation"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    if: ${{ github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch != '' }}
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
      - name: Write status
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          mkdir -p data/daily_scans
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "workflow": "StockScout Full Validation",
              "run_id": int(os.environ["RUN_ID"]),
              "conclusion": os.environ["CONCLUSION"],
              "head_sha": os.environ["HEAD_SHA"],
              "run_url": os.environ["RUN_URL"],
              "updated_at": os.environ["UPDATED_AT"],
          }
          Path("data/daily_scans/full_validation_status.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Commit status to source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/daily_scans/full_validation_status.json
          git commit -m "ci: record full validation status" || exit 0
          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            if git rebase "origin/$TARGET_BRANCH" && git push origin HEAD:"$TARGET_BRANCH"; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
