name: Fundamentals Regression

on:
  pull_request:
    paths:
      - 'src/data/fundamentals_fetcher.py'
      - 'src/data/extended_fundamentals_fetcher.py'
      - 'hydrate_rich_fundamentals.py'
      - 'apply_fundamental_evidence.py'
      - 'fundamental_evidence.py'
      - 'tests/test_fundamentals_fetcher_extended.py'
      - 'tests/test_hydrate_rich_fundamentals.py'
      - 'tests/test_fundamental_evidence.py'
      - 'requirements-ci.lock'
      - '.github/workflows/fundamentals_regression.yml'
  workflow_dispatch:

permissions: {}

jobs:
  fundamentals-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ci.lock
      - run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Compile fundamental pipeline
        run: python -m py_compile src/data/fundamentals_fetcher.py src/data/extended_fundamentals_fetcher.py hydrate_rich_fundamentals.py fundamental_evidence.py apply_fundamental_evidence.py
      - name: Verify frozen upstream execution graph
        run: python verify_legacy_baseline.py
      - name: Additive-metric and Evidence v1 regression tests
        run: python -m pytest tests/test_fundamentals_fetcher_extended.py tests/test_hydrate_rich_fundamentals.py tests/test_fundamental_evidence.py -q
