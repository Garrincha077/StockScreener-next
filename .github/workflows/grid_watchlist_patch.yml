name: Patch grid watchlist heart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grid_watchlist_patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add watchlist heart to Rapid Review cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/DeepVueTerminal.tsx')
          text = path.read_text(encoding='utf-8')

          old = "<GridView stocks={sortedData} count={gridCount} setCount={setGridCount} range={gridRange} setRange={setGridRange} loadBars={loadBars} selected={selected?.ticker} onSelect={setSelectedTicker}/>"
          new = "<GridView stocks={sortedData} count={gridCount} setCount={setGridCount} range={gridRange} setRange={setGridRange} loadBars={loadBars} selected={selected?.ticker} onSelect={setSelectedTicker} watchlist={watchlist} toggleWatch={toggleWatch}/>"
          if old not in text:
              raise SystemExit('GridView call site not found')
          text = text.replace(old, new, 1)

          old = "function GridView({stocks,count,setCount,range,setRange,loadBars,selected,onSelect}:{stocks:Stock[];count:number;setCount:(n:number)=>void;range:Range;setRange:(r:Range)=>void;loadBars:(t:string)=>Promise<Bar[]>;selected?:string;onSelect:(t:string)=>void}){"
          new = "function GridView({stocks,count,setCount,range,setRange,loadBars,selected,onSelect,watchlist,toggleWatch}:{stocks:Stock[];count:number;setCount:(n:number)=>void;range:Range;setRange:(r:Range)=>void;loadBars:(t:string)=>Promise<Bar[]>;selected?:string;onSelect:(t:string)=>void;watchlist:string[];toggleWatch:(ticker:string)=>void}){"
          if old not in text:
              raise SystemExit('GridView signature not found')
          text = text.replace(old, new, 1)

          old = "<MiniCard key={s.ticker} stock={s} range={range} loadBars={loadBars} selected={selected===s.ticker} onClick={()=>onSelect(s.ticker)}/>"
          new = "<MiniCard key={s.ticker} stock={s} range={range} loadBars={loadBars} selected={selected===s.ticker} watched={watchlist.includes(s.ticker)} toggleWatch={()=>toggleWatch(s.ticker)} onClick={()=>onSelect(s.ticker)}/>"
          if old not in text:
              raise SystemExit('MiniCard call site not found')
          text = text.replace(old, new, 1)

          old = "function MiniCard({stock,range,loadBars,selected,onClick}:{stock:Stock;range:Range;loadBars:(t:string)=>Promise<Bar[]>;selected:boolean;onClick:()=>void}){"
          new = "function MiniCard({stock,range,loadBars,selected,watched,toggleWatch,onClick}:{stock:Stock;range:Range;loadBars:(t:string)=>Promise<Bar[]>;selected:boolean;watched:boolean;toggleWatch:()=>void;onClick:()=>void}){"
          if old not in text:
              raise SystemExit('MiniCard signature not found')
          text = text.replace(old, new, 1)

          old = "<header><div><b>{stock.ticker}</b><span>{setupOf(stock)}</span></div><strong>{opp(stock)}</strong></header>"
          new = "<header><div><b>{stock.ticker}</b><span>{setupOf(stock)}</span></div><div className=\"dv-miniactions\"><button className={`dv-heart ${watched?'on':''}`} aria-label={watched?`Remove ${stock.ticker} from watchlist`:`Add ${stock.ticker} to watchlist`} title={watched?'Remove from watchlist':'Add to watchlist'} onClick={e=>{e.stopPropagation();toggleWatch()}}>{watched?'♥':'♡'}</button><strong>{opp(stock)}</strong></div></header>"
          if old not in text:
              raise SystemExit('MiniCard header not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          css_path = Path('frontend/src/deepvue.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '.dv-minicard>header strong{font-size:17px;color:#61e99a}'
          addition = marker + '.dv-miniactions{display:flex!important;flex-direction:row!important;align-items:center;gap:7px}.dv-heart{border:0;background:transparent;color:#65778c;font-size:21px;line-height:1;padding:2px 3px;cursor:pointer}.dv-heart:hover{color:#ff8796;transform:scale(1.08)}.dv-heart.on{color:#ff5f73}.dv-heart:focus-visible{outline:1px solid #ff8796;border-radius:4px}'
          if marker not in css:
              raise SystemExit('MiniCard CSS marker not found')
          css = css.replace(marker, addition, 1)
          css_path.write_text(css, encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm install
          npm run check

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/grid_watchlist_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/DeepVueTerminal.tsx frontend/src/deepvue.css .github/workflows/grid_watchlist_patch.yml
          git commit -m "feat: add watchlist heart to grid cards"
          git push origin HEAD:main
