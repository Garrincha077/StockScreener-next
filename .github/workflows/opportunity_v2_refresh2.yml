name: Opportunity v2 Snapshot Refresh 2

on:
  push:
    paths:
      - '.github/workflows/opportunity_v2_refresh2.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify scoring engine
        run: |
          python -m pip install pytest
          python -m py_compile compute_opportunity_v2.py compute_daily_changes.py
          python -m pytest tests/test_opportunity_v2.py -q

      - name: Recalculate current canonical snapshot
        run: |
          python compute_opportunity_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('frontend/public/data/latest.json')
          p=json.loads(path.read_text(encoding='utf-8'))
          for row in p.get('universe') or []:
              row['opportunityDelta']=0
              row['changeLabels']=[x for x in (row.get('changeLabels') or []) if not str(x).startswith('Score ')]
          p.setdefault('market',{}).setdefault('dailyChanges',{})['opportunityComparable']=False
          path.write_text(json.dumps(p,separators=(',',':'),ensure_ascii=False),encoding='utf-8')
          PY
          python validate_canonical_dataset.py
          python prepare_frontend_payloads.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test and build terminal
        working-directory: frontend
        run: |
          npm install
          npm run check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Persist refreshed Opportunity snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontend/public/data/latest.json frontend/public/data/core.json frontend/public/data/manifest.json
          git commit -m "data: apply Opportunity v2 to current snapshot"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Deploy refreshed terminal
        id: deployment
        uses: actions/deploy-pages@v4
