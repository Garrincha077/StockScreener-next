name: Restore 10/20 MA columns

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore_ma_columns.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-ma-columns
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore 10/20 EMA and SMA fields
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/DeepVueTerminal.tsx')
          text = path.read_text(encoding='utf-8')

          # Reset saved column layout so prior browser localStorage cannot hide restored fields.
          text = text.replace("loadLocal('dv-cols-v3',defaultVisibility)", "loadLocal('dv-cols-v4',defaultVisibility)")
          text = text.replace("localStorage.setItem('dv-cols-v3'", "localStorage.setItem('dv-cols-v4'")

          # Make the 10/20 EMA/SMA cross and spread fields part of the default/Core layout.
          for token in (
              ',ema10d20dCrossAge:false',
              ',ema10d20dSpreadPct:false',
              ',sma10w20wCrossAge:false',
              ',sma10w20wSpreadPct:false',
          ):
              text = text.replace(token, '')

          # Add the raw moving-average values beside the already-existing cross/spread columns.
          marker = "    helper.accessor('ema10d20dCrossAge',{header:'D EMA X'"
          if "header:'EMA 10D'" not in text:
              if marker not in text:
                  raise SystemExit('EMA marker not found')
              text = text.replace(
                  marker,
                  "    helper.accessor('ema10d',{header:'EMA 10D',cell:i=>fmt(i.getValue(),2)}),\n"
                  "    helper.accessor('ema20d',{header:'EMA 20D',cell:i=>fmt(i.getValue(),2)}),\n"
                  + marker,
                  1,
              )

          marker = "    helper.accessor('sma10w20wCrossAge',{header:'W SMA X'"
          if "header:'SMA 10W'" not in text:
              if marker not in text:
                  raise SystemExit('SMA marker not found')
              text = text.replace(
                  marker,
                  "    helper.accessor('sma10w',{header:'SMA 10W',cell:i=>fmt(i.getValue(),2)}),\n"
                  "    helper.accessor('sma20w',{header:'SMA 20W',cell:i=>fmt(i.getValue(),2)}),\n"
                  + marker,
                  1,
              )

          # Ensure the dedicated Crosses preset exposes all raw/cross/spread values too.
          old = "Crosses:{...defaultVisibility,ema10d20dCrossAge:true,ema10d20dSpreadPct:true,sma10w20wCrossAge:true,sma10w20wSpreadPct:true}"
          new = "Crosses:{...defaultVisibility,ema10d:true,ema20d:true,ema10d20dCrossAge:true,ema10d20dSpreadPct:true,sma10w:true,sma20w:true,sma10w20wCrossAge:true,sma10w20wSpreadPct:true}"
          text = text.replace(old, new)

          # Surface raw values in the detail KPI strip without depending on a brittle full-block match.
          ema_kpi = '<K l="D EMA X"'
          if '<K l="EMA 10D"' not in text and ema_kpi in text:
              text = text.replace(
                  ema_kpi,
                  '<K l="EMA 10D" v={fmt(stock.ema10d,2)}/><K l="EMA 20D" v={fmt(stock.ema20d,2)}/>' + ema_kpi,
                  1,
              )
          sma_kpi = '<K l="W SMA X"'
          if '<K l="SMA 10W"' not in text and sma_kpi in text:
              text = text.replace(
                  sma_kpi,
                  '<K l="SMA 10W" v={fmt(stock.sma10w,2)}/><K l="SMA 20W" v={fmt(stock.sma20w,2)}/>' + sma_kpi,
                  1,
              )

          required = [
              "loadLocal('dv-cols-v4',defaultVisibility)",
              "localStorage.setItem('dv-cols-v4'",
              "header:'EMA 10D'",
              "header:'EMA 20D'",
              "header:'SMA 10W'",
              "header:'SMA 20W'",
              "header:'D EMA 10/20'",
              "header:'W SMA 10/20'",
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'MA restore incomplete: {missing}')

          path.write_text(text, encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm install
          npm run check

      - name: Commit restored MA fields
        shell: bash
        run: |
          rm -f .github/workflows/restore_ma_columns.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/DeepVueTerminal.tsx .github/workflows/restore_ma_columns.yml
          git commit -m "fix: restore visible 10/20 EMA and SMA fields"
          git push origin HEAD:main
