name: Daily Stock Screening (Post-Market)

on:
  schedule:
    # Run at 22:30 Croatia time while CEST (UTC+2).
    - cron: '30 20 * * 1-5'

  # Allow manual triggering from the Actions tab.
  workflow_dispatch:
    inputs:
      force_full_refresh:
        description: 'Force refresh all fundamentals (ignore cache)'
        required: false
        type: boolean
        default: false

# Prevent two full-market scans from running at the same time.
concurrency:
  group: daily-stock-screening
  cancel-in-progress: false

jobs:
  screen-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get current date
        id: date
        shell: bash
        run: |
          echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +'%H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Check existing fundamental cache
        id: cache-check
        shell: bash
        run: |
          if [ -d "data/fundamentals_cache" ]; then
            CACHE_COUNT=$(find data/fundamentals_cache -name '*_fundamentals.json' -type f 2>/dev/null | wc -l | tr -d ' ')
            echo "Found existing fundamental cache"
            echo "cached_stocks=$CACHE_COUNT" >> "$GITHUB_OUTPUT"
            echo "Cached stocks: $CACHE_COUNT"

            echo "Cache age distribution:"
            find data/fundamentals_cache -name "*_fundamentals.json" -mtime -7 -type f | wc -l | xargs echo "  <7 days:"
            find data/fundamentals_cache -name "*_fundamentals.json" -mtime +7 -mtime -30 -type f | wc -l | xargs echo "  7-30 days:"
            find data/fundamentals_cache -name "*_fundamentals.json" -mtime +30 -mtime -90 -type f | wc -l | xargs echo "  30-90 days:"
            find data/fundamentals_cache -name "*_fundamentals.json" -mtime +90 -type f | wc -l | xargs echo "  >90 days (stale):"
          else
            echo "No existing cache; creating it"
            mkdir -p data/fundamentals_cache
            echo "cached_stocks=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run optimized stock screening
        env:
          FORCE_FULL_REFRESH: ${{ github.event.inputs.force_full_refresh || 'false' }}
          CACHED_STOCKS: ${{ steps.cache-check.outputs.cached_stocks }}
        run: |
          echo "Starting post-market screening"
          echo "Fresh price data: full universe"
          echo "Cached fundamentals: $CACHED_STOCKS stocks"
          echo ""

          mkdir -p data/daily_scans
          mkdir -p data/logs

          # Conservative mode prioritizes reliability over speed and reduces
          # the risk of Yahoo Finance throttling during a 3,800+ stock scan.
          python run_optimized_scan.py --conservative --git-storage

      - name: Verify latest report
        shell: bash
        run: |
          test -s data/daily_scans/latest_optimized_scan.txt
          echo "Latest report created successfully"
          wc -l data/daily_scans/latest_optimized_scan.txt

      - name: Write run metadata
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "workflow_run_id": os.environ["RUN_ID"],
              "workflow_run_attempt": os.environ["RUN_ATTEMPT"],
              "source_commit": os.environ["COMMIT_SHA"],
              "report": "data/daily_scans/latest_optimized_scan.txt",
          }

          path = Path("data/daily_scans/latest_scan_meta.json")
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Add scan summary
        shell: bash
        run: |
          {
            echo "## Daily stock screening"
            echo ""
            echo "**Run:** ${{ steps.date.outputs.date }} ${{ steps.date.outputs.time }} UTC"
            echo ""
            echo '```text'
            head -n 80 data/daily_scans/latest_optimized_scan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show fundamental refresh stats
        if: always()
        run: |
          echo "=== Fundamental Cache Statistics ==="
          if [ -f "data/fundamentals_cache/metadata.json" ]; then
            python3 <<'PY'
          import json
          from datetime import datetime

          try:
              with open("data/fundamentals_cache/metadata.json", "r", encoding="utf-8") as f:
                  metadata = json.load(f)

              updates = [(ticker, data["last_updated"]) for ticker, data in metadata.items()]
              updates.sort(key=lambda x: x[1], reverse=True)

              print(f"Total tracked: {len(updates)} stocks")
              print("Last 10 updates:")
              for ticker, timestamp in updates[:10]:
                  dt = datetime.fromisoformat(timestamp)
                  print(f"  {ticker}: {dt.strftime('%Y-%m-%d %H:%M')}")
          except Exception as exc:
              print(f"Could not read metadata: {exc}")
          PY
          else
            echo "No metadata file found"
          fi

      - name: Commit cache and latest report
        id: commit
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Persist only reusable cache + canonical latest outputs.
          # Historical timestamped reports remain Actions artifacts and do not bloat Git.
          git add data/fundamentals_cache/
          git add -f data/daily_scans/latest_optimized_scan.txt
          git add -f data/daily_scans/latest_scan_meta.json

          if git diff --staged --quiet; then
            echo "No persistent changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            CHANGED_FILES=$(git diff --staged --name-only | wc -l | tr -d ' ')
            git commit -m "data: post-market scan ${{ steps.date.outputs.date }} ($CHANGED_FILES files)"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push persistent outputs
        if: steps.commit.outputs.has_changes == 'true'
        shell: bash
        run: git push origin HEAD:${{ github.ref_name }}

      - name: Upload full screening results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screening-results-${{ steps.date.outputs.date }}-${{ github.run_id }}
          path: |
            data/daily_scans/
            data/logs/
          if-no-files-found: warn
          retention-days: 90

      - name: Cache size report
        if: always()
        run: |
          echo "=== Git Repository Impact ==="
          if [ -d "data/fundamentals_cache" ]; then
            CACHE_SIZE=$(du -sh data/fundamentals_cache | cut -f1)
            CACHE_FILES=$(find data/fundamentals_cache -name "*.json" | wc -l | tr -d ' ')
            echo "Fundamental cache directory size: $CACHE_SIZE"
            echo "Total cache files: $CACHE_FILES"
          fi
