name: Deploy StockScout Terminal

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/index.html'
      - 'frontend/package.json'
      - 'frontend/tsconfig*.json'
      - 'frontend/vite.config.ts'
      - 'prepare_frontend_payloads.py'
      - 'hydrate_frontend_charts_readonly.py'
      - '.github/workflows/frontend_pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      canonical_sha: ${{ steps.canonical.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Build lightweight client payload
        run: |
          test -s frontend/public/data/latest.json
          python prepare_frontend_payloads.py
          test -s frontend/public/data/core.json
          test -s frontend/public/data/manifest.json

      - name: Build read-only adjusted 5Y chart shards
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas
          BEFORE=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          python hydrate_frontend_charts_readonly.py
          AFTER=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          test "$BEFORE" = "$AFTER"
          test -d frontend/public/data/charts
          echo "Canonical latest.json unchanged: $AFTER"
          echo "Chart shards: $(find frontend/public/data/charts -name '*.json' | wc -l)"
          du -sh frontend/public/data

      - name: Refuse a stale data build
        id: canonical
        shell: bash
        run: |
          LOCAL_SHA=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          git fetch origin main
          REMOTE_SHA=$(git show origin/main:frontend/public/data/latest.json | sha256sum | cut -d' ' -f1)
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "::error::Main scan data advanced while this frontend build was running; refusing to package a stale Pages deployment."
            exit 1
          fi
          echo "sha=$LOCAL_SHA" >> "$GITHUB_OUTPUT"
          echo "Canonical snapshot verified against origin/main: $LOCAL_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: frontend
        run: npm install

      - name: Test, typecheck and build
        working-directory: frontend
        run: npm run check

      - name: Verify Pages artifact contains chart data
        shell: bash
        run: |
          test -d frontend/dist/data/charts
          SHARDS=$(find frontend/dist/data/charts -type f -name '*.json' | wc -l | tr -d ' ')
          if [ "$SHARDS" -le 0 ]; then
            echo "::error::Built Pages artifact contains no chart shards."
            exit 1
          fi
          python - <<'PY'
          import glob, json
          files = glob.glob('frontend/dist/data/charts/*.json')
          tickers = 0
          nonempty = 0
          for path in files:
              with open(path, encoding='utf-8') as fh:
                  payload = json.load(fh)
              if payload:
                  nonempty += 1
                  tickers += len(payload)
          if nonempty == 0 or tickers == 0:
              raise SystemExit('Built Pages artifact chart shards are empty')
          print(f'Pages artifact verified: {nonempty} non-empty shards, {tickers} ticker charts')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: stockscout-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify artifact still matches current canonical scan
        shell: bash
        env:
          BUILT_SHA: ${{ needs.build.outputs.canonical_sha }}
        run: |
          CURRENT_SHA=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          if [ "$CURRENT_SHA" != "$BUILT_SHA" ]; then
            echo "::error::Canonical scan changed after this frontend artifact was built; refusing stale Pages deployment."
            exit 1
          fi
          echo "Deploy snapshot still current: $CURRENT_SHA"

      - name: Deploy read-only terminal build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
