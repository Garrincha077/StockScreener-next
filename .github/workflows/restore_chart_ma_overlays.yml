name: Restore chart MA overlays

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore_chart_ma_overlays.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Daily EMA10/20 and Weekly SMA10/20 overlays
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/DeepVueTerminal.tsx')
          text = path.read_text(encoding='utf-8')

          ma_line = "function ma(values:number[],n:number){const out:(number|null)[]=[];let sum=0;for(let i=0;i<values.length;i++){sum+=values[i];if(i>=n)sum-=values[i-n];out.push(i+1>=n?sum/n:null)}return out}"
          ema_line = "function ema(values:number[],n:number){const out:(number|null)[]=[];if(!values.length)return out;const k=2/(n+1);let value=values[0];for(let i=0;i<values.length;i++){value=i===0?values[i]:values[i]*k+value*(1-k);out.push(i+1>=n?value:null)}return out}"
          if ema_line not in text:
              if ma_line not in text:
                  raise SystemExit('MA helper not found')
              text = text.replace(ma_line, ma_line + '\n' + ema_line, 1)

          old = "const closes=source.map(b=>b.close),specs=interval==='W'?[[10,'#f3c85b'],[30,'#4ca3ff']]:[[10,'#f3c85b'],[20,'#4ca3ff'],[50,'#a36cff'],[200,'#26c7b7']]\n      for(const[n,color]of specs as[number,string][]){const vals=ma(closes,n),line=chart.addSeries(LineSeries,{color,lineWidth:mini?1:2,priceLineVisible:false,lastValueVisible:false});line.setData(source.map((b,i)=>vals[i]==null?null:{time:b.time,value:vals[i]}).filter(Boolean) as any)}"
          new = "const closes=source.map(b=>b.close)\n      const specs=interval==='W'?[[10,'#f3c85b','sma'],[20,'#4ca3ff','sma']]:[[10,'#f3c85b','ema'],[20,'#4ca3ff','ema'],[50,'#a36cff','sma'],[200,'#26c7b7','sma']]\n      for(const[n,color,kind]of specs as[number,string,'ema'|'sma'][]){const vals=kind==='ema'?ema(closes,n):ma(closes,n),line=chart.addSeries(LineSeries,{color,lineWidth:mini?1:2,priceLineVisible:false,lastValueVisible:false});line.setData(source.map((b,i)=>vals[i]==null?null:{time:b.time,value:vals[i]}).filter(Boolean) as any)}"
          if old not in text:
              raise SystemExit('Chart MA overlay block not found')
          text = text.replace(old, new, 1)

          controls = "<div className=\"dv-chartcontrols\"><div>{(['Price','RS','Volume'] as ChartMode[]).map(x=><button className={mode===x?'active':''} onClick={()=>setMode(x)} key={x}>{x}</button>)}</div><div>{(['D','W'] as Interval[]).map(x=><button className={interval===x?'active':''} onClick={()=>setInterval(x)} key={x}>{x==='D'?'Daily':'Weekly'}</button>)}</div><div>{(['3M','6M','1Y','2Y','5Y'] as Range[]).map(x=><button className={range===x?'active':''} onClick={()=>setRange(x)} key={x}>{x}</button>)}</div></div>"
          controls_new = controls + "<div className=\"dv-ma-note\">{interval==='D'?'EMA 10 · EMA 20 · SMA 50 · SMA 200':'SMA 10W · SMA 20W'}</div>"
          if controls in text and 'dv-ma-note' not in text:
              text = text.replace(controls, controls_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm install
          npm run check

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/restore_chart_ma_overlays.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/DeepVueTerminal.tsx .github/workflows/restore_chart_ma_overlays.yml
          git commit -m "fix: restore EMA10/20 and SMA10/20 chart overlays"
          git push origin HEAD:main
