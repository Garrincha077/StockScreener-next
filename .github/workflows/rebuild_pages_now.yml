name: Rebuild StockScout Pages Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild_pages_now.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  rebuild:
    uses: ./.github/workflows/daily_screening_git_storage.yml
    secrets: inherit
