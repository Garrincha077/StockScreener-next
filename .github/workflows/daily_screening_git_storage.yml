name: Daily Stock Screening (Post-Market)

# StockScout Next production-candidate mode: one guarded post-market nightly scan
# plus explicit manual/reusable execution. Stable remains the fallback repository.
on:
  schedule:
    # 22:45 UTC stays safely post-close and staggers Next one hour behind Stable.
    - cron: '45 22 * * 1-5'
  workflow_dispatch:
    inputs:
      force_full_refresh:
        description: 'Force refresh all fundamentals (ignore cache)'
        required: false
        type: boolean
        default: false
      persist_outputs:
        description: 'Persist generated scan outputs to the source branch'
        required: false
        type: boolean
        default: true
      deploy_pages:
        description: 'Publish the validated terminal to GitHub Pages'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      persist_outputs:
        required: false
        type: boolean
        default: true
      deploy_pages:
        required: false
        type: boolean
        default: true

concurrency:
  # Persistent/manual/scheduled scans serialize without cancellation. Any
  # explicit non-persistent/non-deploying invocation is validation-only and gets
  # a separate newest-wins queue. Reusable workflows retain the caller event
  # name, so classification must use the explicit inputs rather than workflow_call.
  group: ${{ github.event_name != 'schedule' && inputs.persist_outputs == false && inputs.deploy_pages == false && 'stockscout-validation-scan' || 'daily-stock-screening' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && inputs.persist_outputs == false && inputs.deploy_pages == false }}

jobs:
  screen-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current date
        id: date
        shell: bash
        run: |
          echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +'%H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Check existing fundamental cache
        id: cache-check
        shell: bash
        run: |
          if [ -d "data/fundamentals_cache" ]; then
            CACHE_COUNT=$(find data/fundamentals_cache -name '*_fundamentals.json' -type f 2>/dev/null | wc -l | tr -d ' ')
            echo "Found existing fundamental cache"
            echo "cached_stocks=$CACHE_COUNT" >> "$GITHUB_OUTPUT"
            echo "Cached stocks: $CACHE_COUNT"
          else
            echo "No existing cache; creating it"
            mkdir -p data/fundamentals_cache
            echo "cached_stocks=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate rich-pipeline Python syntax
        run: |
          python -m py_compile verify_legacy_baseline.py enrich_original_engine.py complete_legacy_capture.py hydrate_rich_fundamentals.py enrich_scan_layers.py fundamental_evidence.py apply_fundamental_evidence.py audit_fundamental_evidence.py compute_group_leadership.py audit_group_leadership.py audit_lateral_base.py audit_emerging_leader.py audit_frontend_dataset.py audit_pipeline_models.py compute_opportunity_v2.py finalize_opportunity_v2.py compute_daily_changes.py validate_scan_session.py validate_canonical_dataset.py validate_frontend_charts.py export_frontend_data_fast.py hydrate_frontend_charts_readonly.py calibrate_frontend_setups.py prepare_frontend_payloads.py stamp_frontend_manifest.py

      - name: Verify frozen LEGACY source baseline
        run: python verify_legacy_baseline.py

      - name: Fast-engine regression tests
        run: python -m pytest tests/test_fast_batch_processor_regression.py tests/test_vcp_mapping.py tests/test_fundamental_evidence.py tests/test_group_leadership.py tests/test_emerging_leader.py tests/test_lateral_base.py tests/test_opportunity_v2.py tests/test_opportunity_v2_integration.py tests/test_prepare_frontend_payloads.py tests/test_stamp_frontend_manifest.py tests/test_validate_frontend_charts.py -q

      - name: Preserve previous terminal snapshot
        shell: bash
        run: |
          mkdir -p data/batch_results
          if [ -s frontend/public/data/latest.json ]; then
            cp frontend/public/data/latest.json data/batch_results/previous_frontend.json
            echo "Previous canonical dataset preserved for daily diff"
          else
            rm -f data/batch_results/previous_frontend.json
            echo "No previous canonical dataset available"
          fi

      - name: Run optimized stock screening
        env:
          FORCE_FULL_REFRESH: ${{ github.event.inputs.force_full_refresh || 'false' }}
          CACHED_STOCKS: ${{ steps.cache-check.outputs.cached_stocks }}
        run: |
          echo "Starting post-market screening"
          echo "Engine: fast batched 5Y price prefetch"
          echo "Priority: maximum useful coverage; runtime is secondary"
          echo "Fresh price data: full universe, one shared market-data pass"
          echo "Cached fundamentals: $CACHED_STOCKS stocks"
          mkdir -p data/daily_scans data/logs
          python run_fast_scan.py --conservative --git-storage

      - name: Verify latest report
        shell: bash
        run: |
          test -s data/daily_scans/latest_optimized_scan.txt
          echo "Latest report created successfully"
          wc -l data/daily_scans/latest_optimized_scan.txt

      - name: Validate completed US market session
        run: python validate_scan_session.py

      - name: Hydrate rich fundamentals for all analyzed stocks
        env:
          FORCE_FULL_REFRESH: ${{ github.event.inputs.force_full_refresh || 'false' }}
          RICH_FUNDAMENTALS_MAX_AGE_DAYS: '7'
          RICH_FUNDAMENTALS_REQUEST_DELAY: '0.35'
        run: |
          echo "Hydrating fundamentals across every analyzed stage"
          python hydrate_rich_fundamentals.py

      - name: Export rich LEGACY + STOCKSCOUT terminal dataset and 5Y charts
        shell: bash
        run: |
          python export_frontend_data_fast.py
          python enhance_frontend_dataset.py
          python calibrate_frontend_setups.py
          python compute_group_leadership.py
          python enrich_original_engine.py
          python complete_legacy_capture.py
          python enrich_scan_layers.py
          python apply_fundamental_evidence.py
          python compute_opportunity_v2.py
          python compute_daily_changes.py data/batch_results/previous_frontend.json frontend/public/data/latest.json
          python finalize_opportunity_v2.py

          test -s frontend/public/data/latest.json
          test -d frontend/public/data/charts
          echo "Chart shards: $(find frontend/public/data/charts -name '*.json' | wc -l)"
          python - <<'PY'
          import json
          p=json.load(open('frontend/public/data/latest.json'))
          m=p.get('market',{})
          print('Feature coverage:', m.get('featureCoverage',0))
          print('Feature model:', p.get('featureModel'))
          print('Calibration:', p.get('calibrationModel'))
          print('Group model:', m.get('groupModel'))
          print('Group avg confidence:', m.get('groupAverageConfidence'))
          print('Group max ranking adjustment:', m.get('groupLeadershipMaxAdjustment'))
          print('Data model:', p.get('dataModel'))
          print('Layers:', list((p.get('layers') or {}).keys()))
          print('LEGACY coverage:', m.get('legacyLayerCoverage',0))
          print('LEGACY complete source coverage:', m.get('legacyCompleteSourceCoverage',0))
          print('STOCKSCOUT coverage:', m.get('stockscoutLayerCoverage',0))
          print('Rich technical coverage:', m.get('richTechnicalCoverage',0))
          print('Rich fundamental coverage:', m.get('richFundamentalCoverage',0))
          print('Fundamental Evidence:', m.get('fundamentalEvidence',{}))
          print('Opportunity model:', p.get('opportunityModel'))
          print('Opportunity v2:', m.get('opportunityV2',{}))
          print('Original-run BUY signals:', m.get('originalRunBuySignals',0))
          print('Original-run SELL signals:', m.get('originalRunSellSignals',0))
          print('Top sector:', m.get('topSector'))
          print('Top industry:', m.get('topIndustry'))
          print('Daily changes:', m.get('dailyChanges',{}))
          PY
          du -sh frontend/public/data

      - name: Validate canonical dataset invariants
        run: python validate_canonical_dataset.py

      - name: Opportunity v2 and model compatibility audit
        run: python audit_pipeline_models.py

      - name: Fundamental evidence audit
        run: python audit_fundamental_evidence.py

      - name: Verify LEGACY source still frozen after enrichment
        run: python verify_legacy_baseline.py

      - name: Build lightweight client payload
        run: |
          python prepare_frontend_payloads.py
          test -s frontend/public/data/core.json
          test -s frontend/public/data/manifest.json
          test -s frontend/public/data/shadow/legacy-confirmation.json

      - name: Validate chart coverage before publish
        shell: bash
        run: |
          python validate_frontend_charts.py frontend/public --strict --minimum-coverage 0.95

      - name: Write run metadata from the canonical snapshot
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          canonical = json.loads(Path("frontend/public/data/latest.json").read_text(encoding="utf-8"))
          generated_at = canonical.get("generatedAt")
          if not generated_at:
              raise SystemExit("Canonical dataset has no generatedAt for run metadata")
          payload = {
              "generated_at_utc": generated_at,
              "workflow_run_id": os.environ["RUN_ID"],
              "workflow_run_attempt": os.environ["RUN_ATTEMPT"],
              "source_commit": os.environ["COMMIT_SHA"],
              "report": "data/daily_scans/latest_optimized_scan.txt",
              "frontend_data": "frontend/public/data/latest.json",
              "frontend_client_data": "frontend/public/data/core.json",
              "chart_horizon": "5y",
              "price_convention": "adjusted-ohlcv",
              "session_guard": "completed-us-session-v1",
              "feature_model": "data-first-v2-early-leader-groups",
              "calibration_model": "early-leader-v2",
              "group_model": "behavioral-proxy-v2-confidence",
              "scan_engine": "fast-batched-5y-v1",
              "data_model": "rich-scan-layers-v1",
              "client_payload_model": "stockscout-client-core-v2",
              "fundamentals_policy": "full-analyzed-universe-max-7d",
              "fundamental_evidence_model": "stockscout-fundamental-evidence-v1",
              "opportunity_model": "stockscout-opportunity-v2-potential-timing",
              "legacy_upstream_commit": "2fce788b7c95e595bdbb012bd35d3a92fcc49e5a",
              "legacy_capture_model": "legacy-complete-source-capture-v1",
              "layers": ["LEGACY", "STOCKSCOUT"],
          }
          Path("data/daily_scans/latest_scan_meta.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Stamp authoritative Next scan and publication identity
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          python stamp_frontend_manifest.py \
            --source-meta data/daily_scans/latest_scan_meta.json \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-ref "$GITHUB_REF_NAME"
          python stamp_frontend_manifest.py \
            --source-meta data/daily_scans/latest_scan_meta.json \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-ref "$GITHUB_REF_NAME" \
            --verify-only
          AFTER=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          test "$BEFORE" = "$AFTER"

      - name: Add scan summary
        shell: bash
        run: |
          {
            echo "## Daily stock screening"
            echo ""
            echo "**Run:** ${{ steps.date.outputs.date }} ${{ steps.date.outputs.time }} UTC"
            echo ""
            echo "**Session:** guarded after completed US regular session"
            echo ""
            echo "**Price convention:** adjusted OHLCV end-to-end"
            echo ""
            echo "**Canonical dataset:** hard invariants passed before publish"
            echo ""
            echo "**Client payload:** lightweight core projection; full LEGACY/rich source payload loads on demand"
            echo ""
            echo "**Provenance:** canonical SHA + deterministic scanId + workflow run embedded in manifest"
            echo ""
            echo "**Layers:** LEGACY (frozen upstream) + STOCKSCOUT (custom discovery)"
            echo ""
            echo "**LEGACY:** complete original runtime outputs + exact market-gated BUY/SELL emission"
            echo ""
            echo "**Fundamentals:** full analyzed universe, target cache age <=7 days"
            echo ""
            echo "**Opportunity v2:** 55% structural Potential + 45% current Timing; calibrated on the live universe with bounded caps"
            echo ""
            echo "**Fundamental Evidence:** transparent v1 score + confidence; used only as a bounded +/-5 Opportunity v2 modifier"
            echo ""
            echo "**Group Leadership:** confidence-weighted behavioral proxies; used only as a bounded +/-5 Opportunity v2 modifier"
            echo ""
            echo '```text'
            head -n 80 data/daily_scans/latest_optimized_scan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit cache and canonical outputs
        if: ${{ github.event_name == 'schedule' || inputs.persist_outputs }}
        id: commit
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/fundamentals_cache/
          git add -f data/daily_scans/latest_optimized_scan.txt
          git add -f data/daily_scans/latest_scan_meta.json
          git add -f frontend/public/data/latest.json
          git add -f frontend/public/data/core.json
          git add -f frontend/public/data/manifest.json
          git add -f frontend/public/data/shadow/legacy-confirmation.json

          if git diff --staged --quiet; then
            echo "No persistent changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            CHANGED_FILES=$(git diff --staged --name-only | wc -l | tr -d ' ')
            git commit -m "data: post-market scan ${{ steps.date.outputs.date }} ($CHANGED_FILES files)"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync persistent outputs to source branch
        if: ${{ (github.event_name == 'schedule' || inputs.persist_outputs) && steps.commit.outputs.has_changes == 'true' }}
        shell: bash
        run: |
          pushed=false
          for attempt in 1 2 3; do
            echo "Sync attempt $attempt/3"
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
              pushed=true
              break
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          if [ "$pushed" != true ]; then
            echo "::error::Canonical push failed after retries; Pages deployment is blocked to prevent publishing data that is not persisted in Git."
            exit 1
          fi

      - name: Upload recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-state-${{ steps.date.outputs.date }}-${{ github.run_id }}
          path: |
            data/daily_scans/latest_optimized_scan.txt
            data/daily_scans/latest_scan_meta.json
            data/batch_results/batch_progress.pkl
            data/batch_results/previous_frontend.json
            frontend/public/data/latest.json
            frontend/public/data/core.json
            frontend/public/data/manifest.json
            frontend/public/data/shadow/legacy-confirmation.json
          if-no-files-found: warn
          retention-days: 14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install terminal dependencies
        working-directory: frontend
        run: npm ci

      - name: Test and build terminal with live scan data
        working-directory: frontend
        run: npm run check

      - name: Verify built Pages artifact contains usable charts
        shell: bash
        run: |
          python validate_frontend_charts.py frontend/dist --strict --minimum-coverage 0.95

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'schedule' || inputs.deploy_pages }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
          retention-days: 14

      - name: Upload full screening results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screening-results-${{ steps.date.outputs.date }}-${{ github.run_id }}
          path: |
            data/daily_scans/
            data/logs/
          if-no-files-found: warn
          retention-days: 90

      - name: Cache size report
        if: always()
        run: |
          echo "=== Git Repository Impact ==="
          if [ -d "data/fundamentals_cache" ]; then
            CACHE_SIZE=$(du -sh data/fundamentals_cache | cut -f1)
            CACHE_FILES=$(find data/fundamentals_cache -name "*.json" | wc -l | tr -d ' ')
            echo "Fundamental cache directory size: $CACHE_SIZE"
            echo "Total cache files: $CACHE_FILES"
          fi

  deploy-pages:
    if: ${{ github.event_name == 'schedule' || inputs.deploy_pages }}
    needs: screen-stocks
    runs-on: ubuntu-latest
    concurrency:
      group: stockscout-pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy live terminal to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
