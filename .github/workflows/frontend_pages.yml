name: Deploy StockScout Terminal

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/index.html'
      - 'frontend/package.json'
      - 'frontend/tsconfig*.json'
      - 'frontend/vite.config.ts'
      - 'hydrate_frontend_charts_readonly.py'
      - '.github/workflows/frontend_pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Build read-only adjusted 5Y chart shards
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas
          test -s frontend/public/data/latest.json
          BEFORE=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          python hydrate_frontend_charts_readonly.py
          AFTER=$(sha256sum frontend/public/data/latest.json | cut -d' ' -f1)
          test "$BEFORE" = "$AFTER"
          test -d frontend/public/data/charts
          echo "Canonical latest.json unchanged: $AFTER"
          echo "Chart shards: $(find frontend/public/data/charts -name '*.json' | wc -l)"
          du -sh frontend/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: frontend
        run: npm install

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy read-only terminal build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
