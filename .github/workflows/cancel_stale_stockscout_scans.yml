name: Cancel stale StockScout scans

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel_stale_stockscout_scans.yml'

concurrency:
  group: daily-stock-screening
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clear-queue:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Cleared older daily-stock-screening runs; next full validation can run cleanly."
